appId: dev.urbanomics.desktop
productName: Urbanomics
directories:
  output: release
# The installer carries code only. The configuration SQL (account, people and alias names) lives in
# a private configuration folder named by Urbanomics/workspace.json, never in the repository.
files:
  - dist/**/*
  - electron/**/*
  - assets/icons/*.png
  - package.json
asar: true
# Development builds carry the amber icon; electron-builder.release.yml swaps in the release icon.
win:
  target: nsis
  icon: assets/icons/icon-dev.ico
  artifactName: Urbanomics-Setup-${version}.${ext}
  signAndEditExecutable: true
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: derekurban
  repo: urbanomics-releases
  releaseType: release

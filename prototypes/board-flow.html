<script>
(()=>{
// MODEL START
const Model={
 cents(v){if(!/^\d+(?:\.\d{1,2})?$/.test(String(v)))return NaN;const[a,b='']=String(v).split('.');const n=Number(a)*100+Number(b.padEnd(2,'0'));return Number.isSafeInteger(n)?n:NaN;},
 equal(total,ids){const q=Math.floor(total/ids.length);return Object.fromEntries(ids.map((id,i)=>[id,q+(i<total%ids.length?1:0)]));},
 expand(selected,groups,expenses){const eligible=new Set(expenses.map(e=>e.id)),seen=new Set();for(const key of selected){const [kind,id]=key.split(':');const ids=kind==='g'?(groups.find(g=>g.id===id)?.members||[]):[id];for(const leaf of ids)if(eligible.has(leaf))seen.add(leaf);}return [...seen];},
 paid(expenseId,payments,except,person){return payments.filter(p=>p.id!==except&&p.balanced&&(!person||p.person===person)).reduce((s,p)=>s+(p.allocations[expenseId]||0),0);},
 capacity(e,payments,except,person){const unclaimed=Math.max(0,e.total-Model.paid(e.id,payments,except));return e.shares?Math.min(unclaimed,Math.max(0,(e.shares[person]||0)-Model.paid(e.id,payments,except,person))):unclaimed;},
 distribute(total,capacities){const ids=Object.keys(capacities),out=Object.fromEntries(ids.map(id=>[id,0]));let remaining=total,active=ids.filter(id=>capacities[id]>0);while(remaining>0&&active.length){const portion=Math.floor(remaining/active.length),remainder=remaining%active.length;let used=0;active.forEach((id,i)=>{const add=Math.min(capacities[id]-out[id],portion+(i<remainder?1:0));out[id]+=add;used+=add;});remaining-=used;active=active.filter(id=>out[id]<capacities[id]);if(!used)break;}return {...out,income:remaining};},
 divider(values,index,value,precision=1,capacities={}){const ids=Object.keys(values);if(!Number.isInteger(index)||index<0||index>=ids.length-1||!Number.isFinite(value))throw Error('Invalid divider');const before=ids.slice(0,index).reduce((s,id)=>s+values[id],0),a=ids[index],b=ids[index+1],combined=values[a]+values[b],min=Math.max(0,combined-(capacities[b]??Infinity)),max=Math.min(combined,capacities[a]??Infinity);const snapped=Math.round(value/precision)*precision;const first=Math.max(min,Math.min(max,snapped-before));return {...values,[a]:first,[b]:combined-first};},
 savePayment(payment,draft,expenses,payments){const allocations={};let sum=0;for(const[id,amount]of Object.entries(draft.values)){if(id==='income')continue;const e=expenses.find(e=>e.id===id);if(!e||!Number.isInteger(amount)||amount<0)throw Error('Enter valid allocation amounts.');if(amount>Model.capacity(e,payments,payment.id,draft.person))throw Error('Allocation exceeds the available expense or agreed share.');if(amount)allocations[id]=amount;sum+=amount;}const income=draft.values.income;if(!Number.isInteger(income)||income<0||sum+income!==payment.amount)throw Error('Allocations and transfer income must equal the payment.');return {...payment,person:draft.person,allocations,income,kind:draft.kind,targets:[...draft.targets],balanced:true};},
 validateShares(e,payments){if(!e.shares)return;if(Object.values(e.shares).some(n=>!Number.isInteger(n)||n<0)||Object.values(e.shares).reduce((a,b)=>a+b,0)!==e.total)throw Error('Shares must equal the full expense.');for(const p of payments.filter(p=>p.balanced&&p.allocations[e.id]))if(Model.paid(e.id,payments,undefined,p.person)>(e.shares[p.person]||0))throw Error('The agreed share is below money already repaid.');},
 personal(e,payments){return e.shares?e.shares.me:e.total-Model.paid(e.id,payments);},

});

function balanceView(){const visible=state.showAll?[...state.payments,...state.expenses]:outstanding();if(visible.length&&!visible.some(r=>r.id===state.active)){state.active=visible[0].id;draft=null;}if(visible.length&&!draft)prepare();return heading('Deduct & balance','Allocate incoming money, then confirm each expense on its own.')+`${state.toast?`<div class="success-line"><span>${esc(state.toast)}</span>${undoState?'<button id="undo">Undo last save</button>':''}</div>`:''}<div class="layout">${balanceQueue()}${visible.length?(draft.amount!==undefined?paymentEditor():expenseEditor()):overview()}</div>`;}
function render(){root.querySelectorAll('[data-stage]').forEach(b=>{b.disabled=Number(b.dataset.stage)>state.unlocked;if(Number(b.dataset.stage)===state.stage)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.innerHTML=state.stage===0?importView():state.stage<3?organizeView():balanceView();if(state.stage===3)updatePreview();if(design.density==='Compact')main.querySelectorAll('.panel').forEach(p=>p.style.padding='12px');}
function barValues(kind){return kind==='tags'?tagDraft.tags:kind==='payment'?draft.values:draft.shares;}
function barTotal(kind){return kind==='tags'?rowTotal(tagDraft):kind==='payment'?draft.amount:draft.total;}
function barCaps(kind){return kind==='payment'?{...capacities(),income:draft.amount}:{};}
function updateBar(kind){const values=barValues(kind),total=barTotal(kind),ids=Object.keys(values),box=main.querySelector(`[data-bar="${kind}"]`);if(!box)return;let at=0;ids.forEach((id,i)=>{box.querySelector(`[data-amount="${id}"]`).textContent=money(values[id]);box.querySelector(`[data-segment="${id}"]`).style.width=values[id]/total*100+'%';at+=values[id];if(i<ids.length-1){const r=box.querySelector(`[data-divider="${i}"]`),n=box.querySelector(`[data-boundary="${i}"]`);r.value=at;r.setAttribute('aria-valuetext',money(values[id])+' / '+money(values[ids[i+1]]));if(document.activeElement!==n)n.value=(at/100).toFixed(2);}});}
function updatePreview(){if(!draft)return;const payment=main.querySelector('#payment-preview');if(payment){const applied=Object.entries(draft.values).filter(([id])=>id!=='income').reduce((s,[,n])=>s+n,0);payment.textContent=money(applied)+' will offset expenses. '+money(draft.values.income)+' will be recorded as Unassigned e-transfer income.';}const expense=main.querySelector('#expense-preview');if(expense){const own=Model.personal(draft,state.payments);const owed=draft.shares?Math.max(0,draft.total-own-Model.paid(draft.id,state.payments)):0;expense.textContent=draft.shares?'Your agreed share: '+money(own)+' · Still owed by others: '+money(owed):'Your cost updates from received repayment links. Saving a repayment does not confirm this expense.';}}
function showError(message){main.querySelector('#form-error').textContent=message;}
function validateBoundaryInputs(){for(const n of main.querySelectorAll('[data-boundary]')){const value=Model.cents(n.value),values=barValues(n.dataset.kind),actual=Object.values(values).slice(0,Number(n.dataset.boundary)+1).reduce((a,b)=>a+b,0);if(!Number.isInteger(value)||value!==actual)throw Error('Use a divider position within its neighbouring limits and chosen precision.');}}
function complete(message){state.toast=message;draft=null;state.active=outstanding()[0]?.id||'';render();say(message);}
function savePayment(){try{if(draft.kind==='repayment'&&!draft.person)throw Error('Select the sender.');validateBoundaryInputs();const original=state.payments.find(p=>p.id===draft.id),candidate=draft.kind==='income'?{...draft,values:{income:draft.amount},targets:[]}:draft;const saved=Model.savePayment(original,candidate,state.expenses,state.payments);capture();state.payments[state.payments.findIndex(p=>p.id===saved.id)]=saved;if(draft.remember&&draft.person)state.aliases[draft.sender]=draft.person;complete('Payment allocation saved. Expense review is unchanged.');}catch(e){showError(e.message);}}

function moveDivider(kind,index,value){const values=Model.divider(barValues(kind),index,value,state.precision,barCaps(kind));if(kind==='tags')tagDraft.tags=values;else if(kind==='payment')draft.values=values;else draft.shares=values;updateBar(kind);updatePreview();const error=main.querySelector('#form-error');if(error)error.textContent='';}
root.addEventListener('input',event=>{const el=event.target;if(el.id==='target-search'){state.query=el.value;main.querySelector('#target-list').innerHTML=targetList();return;}if(el.dataset.divider!==undefined||el.dataset.boundary!==undefined){const value=el.dataset.divider!==undefined?Number(el.value):Model.cents(el.value);if(!Number.isInteger(value)||value<0)return;moveDivider(el.dataset.kind,Number(el.dataset.divider??el.dataset.boundary),value);}});
root.addEventListener('keydown',event=>{const el=event.target;if(el.dataset.divider===undefined)return;const values=barValues(el.dataset.kind),i=Number(el.dataset.divider),current=Object.values(values).slice(0,i+1).reduce((a,b)=>a+b,0),total=Object.values(values).reduce((a,b)=>a+b,0);const next={ArrowRight:current+state.precision,ArrowUp:current+state.precision,ArrowLeft:current-state.precision,ArrowDown:current-state.precision,Home:0,End:total}[event.key];if(next===undefined)return;event.preventDefault();moveDivider(el.dataset.kind,i,next);});
root.addEventListener('change',event=>{if(event.target.id==='remember')draft.remember=event.target.checked;});
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(boardClick(b))return;if(b.dataset.stage!==undefined)return go(Number(b.dataset.stage));if(b.dataset.grab){if(performance.now()<suppressClickUntil)return;state.selectedSource[b.dataset.grab]=b.dataset.source||'';state.selected=state.selected.includes(b.dataset.grab)?state.selected.filter(id=>id!==b.dataset.grab):[...state.selected,b.dataset.grab];render();return;}if(b.dataset.drop!==undefined)return assign(b.dataset.drop,state.selected);if(b.dataset.review){state.active=b.dataset.review;draft=null;render();return;}if(b.dataset.precision){state.precision=Number(b.dataset.precision);render();return;}if(b.dataset.target){draft.targets=Model.toggleTargets(draft.targets,b.dataset.target,state.groups,state.expenses);allocateEvenly();render();return;}if(b.dataset.person){if(b.dataset.multiple==='true'){const ids=Object.keys(draft.shares).filter(id=>id!==b.dataset.person);if(!Object.hasOwn(draft.shares,b.dataset.person))ids.push(b.dataset.person);draft.shares=Model.equal(draft.total,ids);}else{draft.person=b.dataset.person;allocateEvenly();}render();return;}if(b.dataset.option){const f=b.dataset.option,v=b.dataset.value;if(f==='showAll'){state.showAll=v==='true';draft=null;}else if(f==='kind')draft.kind=v;else if(f==='method')draft.shares=v==='received'?null:Model.equal(draft.total,['me','alex']);render();return;}switch(b.id){case'import':state.unlocked=Math.max(1,state.unlocked);go(1);break;case'next-stage':state.unlocked=Math.max(state.unlocked,state.stage+1);go(state.stage+1);break;case'remove-groups':state.groups=state.groups.map(g=>({...g,members:g.members.filter(id=>!state.selected.includes(id))}));state.selected=[];render();break;case'distribute':allocateEvenly();render();break;case'equal-people':draft.shares=Model.equal(draft.total,Object.keys(draft.shares));render();break;case'save-payment':savePayment();break;case'save-expense':try{validateBoundaryInputs();Model.validateShares(draft,state.payments);capture();draft.balanced=true;state.expenses[state.expenses.findIndex(e=>e.id===draft.id)]=clone(draft);complete('Expense confirmed.');}catch(e){showError(e.message);}break;case'undo':if(undoState){state.expenses=undoState.expenses;state.payments=undoState.payments;state.aliases=undoState.aliases;state.active=undoState.active;undoState=null;draft=null;state.toast='Last save undone.';render();}break;case'show-all':state.showAll=true;draft=null;render();break;}});
root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='create-group'){const name=main.querySelector('#group-name').value.trim();if(!name)return;state.groups.push({id:'group'+state.groups.length,name,members:[]});render();say('Event group created.');}});
root.addEventListener('pointerdown',event=>{const item=event.target.closest('[data-grab]');if(!item||event.button!==0)return;dragState={id:item.dataset.grab,source:item.dataset.source||'',x:event.clientX,y:event.clientY,pointer:event.pointerId,item,moved:false};item.setPointerCapture(event.pointerId);});
root.addEventListener('pointermove',event=>{if(!dragState||event.pointerId!==dragState.pointer)return;if(Math.hypot(event.clientX-dragState.x,event.clientY-dragState.y)>6)dragState.moved=true;if(!dragState.moved)return;event.preventDefault();root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]')?.classList.add('drag-over');});
root.addEventListener('pointerup',event=>{if(!dragState||event.pointerId!==dragState.pointer)return;const current=dragState;dragState=null;if(current.item.hasPointerCapture(event.pointerId))current.item.releasePointerCapture(event.pointerId);root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(!current.moved)return;suppressClickUntil=performance.now()+150;const bucket=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]');if(bucket)assign(bucket.dataset.drop,state.selected.includes(current.id)?state.selected:[current.id],current.source);});
root.addEventListener('pointercancel',()=>{dragState=null;root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
syncCategories();
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'Workspace spacing',options:['Comfortable','Compact']});}
})();

</script>
</div>

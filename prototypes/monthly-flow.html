<div id="urbanomics-flow" aria-label="Urbanomics monthly workflow">
<style>
#urbanomics-flow{color-scheme:light dark;--u-bg:light-dark(#f7f8f4,#171c19);--u-panel:light-dark(#fff,#222924);--u-ink:light-dark(#21392e,#e1ece3);--u-muted:light-dark(#617368,#adbdaf);--u-line:light-dark(#dce5dd,#405046);--u-soft:light-dark(#edf3ed,#2b3b30);--u-accent:light-dark(#265e42,#a4dbb5);--u-onaccent:light-dark(#fff,#182a1f);--u-warn:light-dark(#80552a,#e9bd8a);font:400 14px/1.5 system-ui,sans-serif;background:var(--u-bg);color:var(--u-ink);border:1px solid var(--u-line);border-radius:16px;overflow:hidden}
#urbanomics-flow *{box-sizing:border-box}#urbanomics-flow button,#urbanomics-flow input,#urbanomics-flow select{font:inherit}#urbanomics-flow button{cursor:pointer;border:1px solid var(--u-line);background:var(--u-panel);color:var(--u-ink);padding:9px 14px;border-radius:8px;min-height:42px}#urbanomics-flow button:hover{background:var(--u-soft)}#urbanomics-flow button:disabled{cursor:default;opacity:.5}#urbanomics-flow .u-primary{background:var(--u-accent);color:var(--u-onaccent);border-color:var(--u-accent)}#urbanomics-flow .u-primary:hover{filter:brightness(.93)}#urbanomics-flow .u-top{padding:19px 26px;border-bottom:1px solid var(--u-line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}#urbanomics-flow .u-brand{font-size:20px;letter-spacing:-.7px;font-weight:500}#urbanomics-flow .u-brand span{color:var(--u-muted);font-size:13px;letter-spacing:0;margin-left:12px}#urbanomics-flow .u-tag{font-size:12px;border:1px solid var(--u-line);border-radius:20px;padding:4px 10px;color:var(--u-muted)}#urbanomics-flow .u-nav{display:flex;gap:6px;padding:12px 26px;border-bottom:1px solid var(--u-line);flex-wrap:wrap}#urbanomics-flow .u-nav button{border:0;background:transparent;color:var(--u-muted)}#urbanomics-flow .u-nav button[aria-current=page]{color:var(--u-ink);background:var(--u-soft)}#urbanomics-flow .u-main{padding:26px}#urbanomics-flow .u-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}#urbanomics-flow h2{font-size:26px;letter-spacing:-.8px;font-weight:500;margin:0 0 5px}#urbanomics-flow h3{font-size:16px;font-weight:500;margin:0 0 12px}#urbanomics-flow p{margin:0 0 12px}#urbanomics-flow .u-sub{color:var(--u-muted)}#urbanomics-flow .u-panel{border:1px solid var(--u-line);background:var(--u-panel);border-radius:12px;padding:20px}#urbanomics-flow .u-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}#urbanomics-flow .u-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--u-line)}#urbanomics-flow .u-row:last-child{border-bottom:0}#urbanomics-flow .u-row small{display:block;color:var(--u-muted);font-size:12px}#urbanomics-flow .u-money{font-variant-numeric:tabular-nums;white-space:nowrap}#urbanomics-flow .u-file{display:flex;gap:12px;align-items:center;margin-bottom:18px}#urbanomics-flow .u-file-mark{padding:12px;background:var(--u-soft);border-radius:9px;font-size:12px}#urbanomics-flow .u-file-name{overflow-wrap:anywhere}#urbanomics-flow .u-receipt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:20px}#urbanomics-flow .u-receipt b{display:block;font-size:25px;font-weight:500}#urbanomics-flow .u-receipt span{font-size:12px;color:var(--u-muted)}#urbanomics-flow details{margin-bottom:20px}#urbanomics-flow summary{cursor:pointer;color:var(--u-muted)}#urbanomics-flow .u-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}#urbanomics-flow .u-kicker{color:var(--u-muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}#urbanomics-flow .u-amount{font-size:36px;letter-spacing:-1px;line-height:1.2;margin:6px 0 18px;font-variant-numeric:tabular-nums}#urbanomics-flow .u-choice{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--u-line);border-radius:8px;margin:8px 0;cursor:pointer}#urbanomics-flow input[type=radio],#urbanomics-flow input[type=checkbox]{accent-color:var(--u-accent);width:18px;height:18px}#urbanomics-flow input[type=number],#urbanomics-flow select{padding:9px 10px;max-width:100%;width:100%;border:1px solid var(--u-line);border-radius:7px;background:var(--u-panel);color:var(--u-ink)}#urbanomics-flow .u-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}#urbanomics-flow .u-field{display:block;color:var(--u-muted)}#urbanomics-flow .u-field input,#urbanomics-flow .u-field select{margin-top:6px;color:var(--u-ink)}#urbanomics-flow .u-explanation{padding:14px;background:var(--u-soft);border-radius:8px;margin-top:14px}#urbanomics-flow .u-warning{color:var(--u-warn)}#urbanomics-flow .u-list-button{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin:8px 0;padding:13px!important}#urbanomics-flow .u-list-button[aria-pressed=true]{border-color:var(--u-accent);background:var(--u-soft)}#urbanomics-flow .u-list-button small{display:block;color:var(--u-muted)}#urbanomics-flow .u-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}#urbanomics-flow .u-stats .u-panel{padding:16px}#urbanomics-flow .u-stat-value{font-size:28px;letter-spacing:-.7px;margin:7px 0}#urbanomics-flow .u-bar{height:7px;border-radius:4px;background:var(--u-soft);margin-top:8px;overflow:hidden}#urbanomics-flow .u-bar span{display:block;background:var(--u-accent);height:100%}#urbanomics-flow .u-category{width:100%;text-align:left;margin-bottom:8px;background:transparent!important;border:0!important;padding:10px 0!important}#urbanomics-flow .u-category[aria-pressed=true]{text-decoration:underline}#urbanomics-flow .u-foot{padding:12px 26px;border-top:1px solid var(--u-line);font-size:12px;color:var(--u-muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#urbanomics-flow .u-error{color:var(--u-warn);margin-top:12px}#urbanomics-flow [hidden]{display:none!important}#urbanomics-flow strong{font-weight:500}
@media(max-width:650px){#urbanomics-flow .u-split{grid-template-columns:1fr}#urbanomics-flow .u-main{padding:18px}#urbanomics-flow .u-top,#urbanomics-flow .u-nav,#urbanomics-flow .u-foot{padding-left:18px;padding-right:18px}#urbanomics-flow .u-stats{grid-template-columns:1fr}#urbanomics-flow .u-stats .u-panel{display:grid;grid-template-columns:1fr auto;gap:4px 12px}#urbanomics-flow .u-stat-value{grid-column:2;grid-row:1/3;margin:0}#urbanomics-flow .u-fields{grid-template-columns:1fr}#urbanomics-flow h2{font-size:23px}}
</style>
<header class="u-top"><div class="u-brand">urbanomics<span>Your money, made clear.</span></div><span class="u-tag">Interactive sample · CAD</span></header>
<nav class="u-nav" aria-label="Monthly workflow"><button data-page="import" aria-current="page">1 · Import</button><button data-page="review" disabled>2 · Review</button><button data-page="spending" disabled>3 · Spending</button></nav>
<main class="u-main"></main>
<footer class="u-foot"><span>Synthetic data · Changes last until this preview is reloaded.</span><span>September 2026</span></footer>
<div class="u-announcement" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<script>
(()=>{
const root=document.getElementById('urbanomics-flow');
const main=root.querySelector('.u-main');
const state={page:'import',imported:false,selected:'dinner',split:false,own:6000,category:'Eating out',linked:false,filter:null};
const design={summary:'Your share',density:'Comfortable'};
const format=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n/100);
const expenses=()=>[{id:'dinner',name:'Dinner at Juniper',date:'Sep 5',category:state.category,gross:12000,own:state.split?state.own:12000},{id:'groceries',name:'Neighbourhood market',date:'Sep 6',category:'Groceries',gross:8600,own:8600},{id:'transit',name:'Transit pass top-up',date:'Sep 7',category:'Transport',gross:3200,own:3200},{id:'music',name:'Music subscription',date:'Sep 8',category:'Subscriptions',gross:1400,own:1400}];
const totals=()=>({personal:expenses().reduce((s,t)=>s+t.own,0),owed:state.split?12000-state.own-(state.linked?3000:0):0,cash:25200-(state.linked?3000:0)});
function announce(t){root.querySelector('.u-announcement').textContent=t;}
function go(page){state.page=page;render();main.querySelector('h2')?.scrollIntoView({block:'nearest'});}
function header(title,sub){return `<div class="u-heading"><div><h2>${title}</h2><p class="u-sub">${sub}</p></div><span class="u-tag">September 2026</span></div>`;}
function importView(){return header('Bring your month together','Choose the month. Check what comes in. Then review what needs your attention.')+`<div class="u-split"><section class="u-panel"><div class="u-kicker">Sample import preview</div><div class="u-file"><span class="u-file-mark">CSV</span><div class="u-file-name"><strong>sample-chequing-september.csv</strong><div class="u-sub">Everyday chequing · September 2026</div></div></div><div class="u-receipt"><div><b>8</b><span>Rows in export</span></div><div><b>6</b><span>In September</span></div><div><b>2</b><span>Outside month</span></div></div><details><summary>See the two excluded rows</summary><div class="u-row"><span>Aug 31 · Coffee</span><span class="u-money">−$6.00</span></div><div class="u-row"><span>Oct 1 · Groceries</span><span class="u-money">−$45.00</span></div></details><div class="u-explanation">Original export kept intact. Only September rows enter this month’s view.</div><div class="u-actions"><span class="u-sub">${state.imported?'Sample already imported':'One account · sample workflow'}</span><button class="u-primary" id="u-import">${state.imported?'Return to review':'Import 6 transactions'}</button></div></section><section class="u-panel"><h3>What’s in this month</h3><div class="u-row"><span>4 purchases<small>Groceries, dinner, transport, music</small></span><span class="u-money">$252.00</span></div><div class="u-row"><span>1 incoming e-transfer<small>Needs a purpose</small></span><span class="u-money">+$30.00</span></div><div class="u-row"><span>1 pay deposit<small>Already categorized in this sample</small></span><span class="u-money">+$3,000.00</span></div><p class="u-sub" style="margin-top:16px">This preview simulates file selection and import. It does not read or archive real files.</p></section></div>`;}
function dinnerEditor(){return `<section class="u-panel"><div class="u-kicker">Sep 5 · Everyday chequing</div><h3>Dinner at Juniper</h3><div class="u-amount">$120.00</div><form id="u-split-form"><label class="u-choice"><input type="radio" name="treatment" value="shared" checked> I covered someone else</label><label class="u-choice"><input type="radio" name="treatment" value="mine"> This was all mine</label><div id="u-share-fields"><div class="u-fields"><label class="u-field">Shared with<select id="u-person"><option>Alex (sample friend)</option></select></label><label class="u-field">Category<select id="u-category">${['Eating out','Groceries','Travel'].map(c=>`<option ${state.category===c?'selected':''}>${c}</option>`).join('')}</select></label></div><label class="u-choice"><input type="radio" name="split-mode" value="half" ${state.own===6000?'checked':''}> Split equally · $60.00 each</label><label class="u-choice"><input type="radio" name="split-mode" value="custom" ${state.own!==6000?'checked':''}> Set my own share</label><label class="u-field" id="u-custom-field" ${state.own===6000?'hidden':''}>My share (CAD)<input id="u-own" type="number" min="0" max="120" step="0.01" value="${(state.own/100).toFixed(2)}"></label></div><div class="u-explanation" id="u-split-preview"></div><div class="u-error" id="u-split-error" role="alert"></div><div class="u-actions"><span class="u-sub">${state.split?'You can revise this split.':'No repayment needed to record a share.'}</span><button class="u-primary" type="submit">Save expense</button></div></form></section>`;}
function repaymentEditor(){if(!state.split)return `<section class="u-panel"><div class="u-kicker">Sep 9 · Incoming e-transfer</div><h3>$30.00 from Alex</h3><p>There isn’t a shared expense to attach this to yet.</p><p class="u-sub">It stays unclassified. It is not included in income or used to reduce spending.</p><button id="u-open-dinner">Review the dinner first</button></section>`;const share=12000-state.own;return `<section class="u-panel"><div class="u-kicker">Sep 9 · Incoming e-transfer</div><h3>Alex sent you $30.00</h3><p class="u-sub">Choose what this payment settles.</p><div class="u-explanation"><strong>Dinner at Juniper · Sep 5</strong><div class="u-row"><span>Alex’s agreed share</span><span>${format(share)}</span></div><div class="u-row"><span>${state.linked?'Still owed after this payment':'Still owed before this payment'}</span><span>${format(share-(state.linked?3000:0))}</span></div></div><p style="margin-top:16px">${state.linked?'Linked to the dinner. Your spending stays the same.':share<3000?'This payment exceeds Alex’s share. It cannot all be linked to this expense in this prototype.':'Confirm the connection yourself. This amount will reduce what Alex owes, and won’t count as income.'}</p><div class="u-actions"><span class="u-sub">Your dinner spending: ${format(state.own)}</span><button class="u-primary" id="u-link" ${share<3000?'disabled':''}>${state.linked?'Unlink repayment':'Link repayment'}</button></div></section>`;}
function reviewView(){return header('Give each movement its meaning','Your bank records what moved. You decide which part was yours.')+`<div class="u-split"><section><div class="u-panel"><h3>Review this month</h3><button class="u-list-button" data-select="dinner" aria-pressed="${state.selected==='dinner'}"><span>Dinner at Juniper<small>${state.split?'Shared with Alex · your share '+format(state.own):'Was this expense shared?'}</small></span><span class="u-money">$120.00</span></button><button class="u-list-button" data-select="repayment" aria-pressed="${state.selected==='repayment'}"><span>E-transfer from Alex<small>${state.linked?'Linked · part of dinner repaid':'Choose what this payment is for'}</small></span><span class="u-money">+$30.00</span></button><div class="u-row"><span>Other purchases<small>Groceries, transport, subscriptions</small></span><span class="u-money">$132.00</span></div></div><div class="u-explanation">${state.split?`Personal spending: <strong>${format(totals().personal)}</strong> · Owed back: <strong>${format(totals().owed)}</strong>`:'Until you record a split, the full $120 dinner is included in spending.'}</div><div class="u-actions"><button id="u-see-spending">See spending breakdown</button></div></section>${state.selected==='dinner'?dinnerEditor():repaymentEditor()}</div>`;}
function spendingView(){const t=totals();const cats=[...new Set(expenses().map(x=>x.category))];return header('What did you spend on?','Your share of purchases, grouped by category. Select a category to see its expenses.')+`<div class="u-stats"><div class="u-panel"><span>${design.summary==='Your share'?'Your spending':'Personal spending'}</span><div class="u-stat-value">${format(t.personal)}</div><small class="u-sub">${state.split?'Your agreed share, paid or still owed':'Full costs until splits are recorded'}</small></div><div class="u-panel"><span>Owed back to you</span><div class="u-stat-value">${format(t.owed)}</div><small class="u-sub">${state.split?'Alex · dinner':'No shared expenses recorded'}</small></div><div class="u-panel"><span>Net paid for expenses</span><div class="u-stat-value">${format(t.cash)}</div><small class="u-sub">Purchases less linked repayments</small></div></div>${!state.linked?'<p class="u-warning">One incoming $30 transfer still needs a purpose. It is excluded from income and expense adjustments.</p>':''}<div class="u-split"><section class="u-panel"><h3>By category</h3>${cats.map(c=>{const amount=expenses().filter(x=>x.category===c).reduce((s,x)=>s+x.own,0);return `<button class="u-category" data-category="${c}" aria-pressed="${state.filter===c}"><span style="display:flex;justify-content:space-between;gap:12px"><span>${c}</span><span class="u-money">${format(amount)}</span></span><div class="u-bar"><span style="width:${t.personal?amount/t.personal*100:0}%"></span></div></button>`}).join('')}</section><section class="u-panel"><h3>${state.filter||'Your expenses'}</h3>${expenses().filter(x=>!state.filter||state.filter===x.category).map(x=>`<div class="u-row"><span>${x.name}<small>${x.date}${x.id==='dinner'&&state.split?' · You paid $120.00':''}</small></span><span class="u-money">${format(x.own)}</span></div>`).join('')}<div class="u-actions"><button id="u-edit-dinner">Edit dinner split</button>${state.split?`<button id="u-manage-repayment">${state.linked?'View repayment':'Review repayment'}</button>`:''}</div></section></div>`;}
function readShare(){if(main.querySelector('[name=treatment]:checked').value==='mine')return 12000;if(main.querySelector('[name=split-mode]:checked').value==='half')return 6000;const v=main.querySelector('#u-own').value;if(!/^\d+(?:\.\d{1,2})?$/.test(v))return NaN;const [whole,fraction='']=v.split('.');return Number(whole)*100+Number(fraction.padEnd(2,'0'));}
function updateSplit(){const allMine=main.querySelector('[name=treatment]:checked').value==='mine';main.querySelector('#u-share-fields').hidden=allMine;main.querySelector('#u-custom-field').hidden=main.querySelector('[name=split-mode]:checked').value==='half';const own=readShare();main.querySelector('#u-split-preview').textContent=Number.isSafeInteger(own)&&own>=0&&own<=12000?`Your spending: ${format(own)} · Alex’s share: ${format(12000-own)}${state.linked?' · Already repaid: $30.00':''}`:'Enter your share between $0.00 and $120.00.';}
function render(){root.style.setProperty('--u-density',design.density==='Compact'?'12px':'20px');root.querySelectorAll('[data-page]').forEach(b=>{b.disabled=b.dataset.page!=='import'&&!state.imported;if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.innerHTML=state.page==='import'?importView():state.page==='review'?reviewView():spendingView();if(design.density==='Compact')main.querySelectorAll('.u-panel').forEach(p=>p.style.padding='12px');if(state.page==='review'&&state.selected==='dinner'){updateSplit();main.querySelector('#u-split-form').addEventListener('input',updateSplit);main.querySelector('#u-split-form').addEventListener('change',updateSplit);main.querySelector('#u-split-form').addEventListener('submit',e=>{e.preventDefault();const own=readShare();if(!Number.isSafeInteger(own)||own<0||own>12000){main.querySelector('#u-split-error').textContent='Enter an amount from $0.00 to $120.00, with up to two decimal places.';return;}if(state.linked&&12000-own<3000){main.querySelector('#u-split-error').textContent='Alex has already repaid $30.00. Unlink that payment before reducing their share below $30.00.';return;}state.own=own;state.split=own<12000;state.category=main.querySelector('#u-category').value;state.filter=null;state.selected='repayment';render();announce('Expense saved. Personal spending is '+format(totals().personal)+'.');});}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.select){state.selected=b.dataset.select;render();return;}if(b.dataset.category){state.filter=state.filter===b.dataset.category?null:b.dataset.category;render();return;}switch(b.id){case'u-import':state.imported=true;go('review');announce('Six sample transactions imported. Two rows outside September excluded.');break;case'u-open-dinner':case'u-edit-dinner':state.selected='dinner';go('review');break;case'u-see-spending':go('spending');break;case'u-manage-repayment':state.selected='repayment';go('review');break;case'u-link':state.linked=!state.linked;render();announce(state.linked?'Repayment linked. Your spending is unchanged. Alex still owes '+format(totals().owed)+'.':'Repayment unlinked.');break;}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'Spacing',options:['Comfortable','Compact']});tweak.addSelect(design,'summary',{label:'Summary wording',options:['Your share','Personal spending']});}
})();
</script>
</div>

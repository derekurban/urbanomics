<div id="urbanomics-review" aria-label="Urbanomics review experience">
<style>
#urbanomics-review{color-scheme:light dark;--bg:light-dark(#f7f8f4,#161e19);--surface:light-dark(#fff,#202b24);--text:light-dark(#243d2e,#e5eee7);--muted:light-dark(#64766a,#aabaae);--line:light-dark(#dfe6df,#3a4d40);--soft:light-dark(#edf3ed,#2b3c30);--accent:light-dark(#286046,#a7d9b5);--on:light-dark(#fff,#173522);--other:light-dark(#849e83,#678b70);--third:light-dark(#bdcbb7,#415e48);--warn:light-dark(#80542c,#edbc88);font:400 14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#urbanomics-review *{box-sizing:border-box}#urbanomics-review button,#urbanomics-review input,#urbanomics-review select{font:inherit}#urbanomics-review button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 13px;min-height:42px;cursor:pointer}#urbanomics-review button:hover{background:var(--soft)}#urbanomics-review button:disabled{opacity:.45;cursor:default}#urbanomics-review .primary{background:var(--accent);color:var(--on);border-color:var(--accent)}#urbanomics-review .primary:hover{filter:brightness(.93)}#urbanomics-review .top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line)}#urbanomics-review .brand{font-size:21px;font-weight:500;letter-spacing:-.6px}#urbanomics-review .muted,#urbanomics-review small{color:var(--muted)}#urbanomics-review small{font-size:12px}#urbanomics-review .tag{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:18px;color:var(--muted)}#urbanomics-review nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--line)}#urbanomics-review nav button{border:0;background:transparent;color:var(--muted)}#urbanomics-review nav button[aria-current=page]{background:var(--soft);color:var(--text)}#urbanomics-review main{padding:24px}#urbanomics-review h2{font-size:25px;letter-spacing:-.7px;font-weight:500;margin:0 0 5px}#urbanomics-review h3{font-size:17px;font-weight:500;margin:0 0 12px}#urbanomics-review p{margin:0 0 14px}#urbanomics-review .heading{margin-bottom:22px}#urbanomics-review .panel{padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}#urbanomics-review .layout{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.5fr);gap:20px;align-items:start}#urbanomics-review .line{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}#urbanomics-review .receipt{max-width:780px;margin:auto}#urbanomics-review .file{padding:18px 0;margin:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#urbanomics-review .file strong{overflow-wrap:anywhere}#urbanomics-review .subline{margin-top:5px;color:var(--muted);font-size:12px}#urbanomics-review .actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}#urbanomics-review .item{display:flex;text-align:left;width:100%;justify-content:space-between;gap:12px;align-items:center;padding:12px;margin:7px 0}#urbanomics-review .item small{display:block}#urbanomics-review .item[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}#urbanomics-review .money{font-variant-numeric:tabular-nums;white-space:nowrap}#urbanomics-review .amount{font-size:30px;letter-spacing:-1px;margin-bottom:18px}#urbanomics-review .eyebrow{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}#urbanomics-review .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}#urbanomics-review label.field{display:block;font-size:12px;color:var(--muted)}#urbanomics-review select,#urbanomics-review input[type=text],#urbanomics-review input[type=number]{display:block;border:1px solid var(--line);border-radius:7px;padding:9px;width:100%;background:var(--surface);color:var(--text);margin-top:5px;font-size:14px}#urbanomics-review .check{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:40px}#urbanomics-review input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}#urbanomics-review .people-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 15px}#urbanomics-review .people-chips .check{padding:3px 10px;background:var(--soft);border-radius:20px}#urbanomics-review .band{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--soft);margin:12px 0}#urbanomics-review .band>span{min-width:0;background:var(--accent)}#urbanomics-review .band>span:nth-child(2){background:var(--other)}#urbanomics-review .band>span:nth-child(n+3){background:var(--third)}#urbanomics-review .share-row{margin:12px 0}#urbanomics-review input[type=range]{width:100%;accent-color:var(--accent);margin:9px 0 2px;min-height:24px}#urbanomics-review .share-value{display:flex;align-items:center;gap:6px}#urbanomics-review .share-value input{width:94px;text-align:right;padding:5px;margin:0}#urbanomics-review .notice{padding:12px 14px;background:var(--soft);border-radius:8px;margin:14px 0;color:var(--muted);font-size:13px}#urbanomics-review .allocation{border-top:1px solid var(--line);padding:14px 0}#urbanomics-review .allocation .allocate-input{width:110px}#urbanomics-review details{margin-top:10px}#urbanomics-review summary{cursor:pointer;color:var(--muted);font-size:13px}#urbanomics-review .warn{color:var(--warn)}#urbanomics-review .error{color:var(--warn);margin-top:12px}#urbanomics-review .section-label{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}#urbanomics-review .section-label:first-child{margin-top:0}#urbanomics-review .row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}#urbanomics-review .row:last-child{border-bottom:0}#urbanomics-review .person-icon{width:34px;height:34px;background:var(--soft);border-radius:50%;display:grid;place-items:center}#urbanomics-review .footer{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 24px;color:var(--muted);font-size:12px}#urbanomics-review .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#urbanomics-review [hidden]{display:none!important}#urbanomics-review strong{font-weight:500}
@media(max-width:690px){#urbanomics-review .layout{grid-template-columns:1fr}#urbanomics-review main{padding:16px}#urbanomics-review .top,#urbanomics-review nav,#urbanomics-review .footer{padding-left:16px;padding-right:16px}#urbanomics-review .fields{grid-template-columns:1fr}#urbanomics-review .panel{padding:16px}#urbanomics-review h2{font-size:23px}#urbanomics-review .item{min-height:48px}}
</style>
<header class="top"><span class="brand">urbanomics</span><span class="tag">September 2026 · CAD · Sample</span></header>
<nav aria-label="Urbanomics"><button data-page="import" aria-current="page">Import</button><button data-page="review" disabled>Review</button><button data-page="people">People</button><button data-page="groups">Groups</button><button data-page="spending" disabled>Spending</button></nav>
<main></main><footer class="footer"><span>Interactive sample · No real uploads · Changes reset on reload</span><span>One month, one account</span></footer><div class="sr" role="status" aria-live="polite"></div>
<script>
(()=>{
// MODEL START
const Model={
  cents(value){if(!/^\d+(?:\.\d{1,2})?$/.test(String(value)))return NaN;const [a,b='']=String(value).split('.');const n=Number(a)*100+Number(b.padEnd(2,'0'));return Number.isSafeInteger(n)?n:NaN;},
  equal(total,ids){const base=Math.floor(total/ids.length);return Object.fromEntries(ids.map((id,i)=>[id,base+(i<total%ids.length?1:0)]));},
  move(total,shares,id,value){const ids=Object.keys(shares);if(!ids.includes(id)||!Number.isInteger(value)||value<0||value>total)throw Error('Invalid share');if(ids.length===1)return {[id]:total};const rest=ids.filter(k=>k!==id),sum=rest.reduce((s,k)=>s+shares[k],0),left=total-value;const result={[id]:value};let used=0;rest.forEach((k,i)=>{result[k]=i===rest.length-1?left-used:Math.floor(left*(sum?shares[k]/sum:1/rest.length));used+=result[k];});return Object.fromEntries(ids.map(k=>[k,result[k]]));},
  owed(expense,person,payments,except){return (expense.shares[person]||0)-payments.filter(p=>p.id!==except&&p.kind==='repayment'&&p.person===person).reduce((s,p)=>s+(p.allocations[expense.id]||0),0);},
  allocate(amount,expenses,person,payments,except){let left=amount;return Object.fromEntries(expenses.map(e=>{const n=Math.min(left,Math.max(0,Model.owed(e,person,payments,except)));left-=n;return[e.id,n];}));},
  validateSplit(expense,payments,except){if(Object.values(expense.shares).some(v=>!Number.isInteger(v)||v<0)||Object.values(expense.shares).reduce((a,b)=>a+b,0)!==expense.total)throw Error('Shares must add up to the expense total.');for(const p of payments.filter(p=>p.id!==except&&p.kind==='repayment'))if(Model.owed(expense,p.person,payments,except)<0)throw Error('A person has already repaid more than this new share. Edit that repayment first.');},
  settle(payment,expenses,payments){let sum=0;for(const [id,n]of Object.entries(payment.allocations)){const e=expenses.find(x=>x.id===id);if(!e||!Number.isInteger(n)||n<0)throw Error('Enter valid repayment amounts.');if(n>Math.max(0,Model.owed(e,payment.person,payments,payment.id)))throw Error('A repayment cannot exceed this person’s unpaid share.');sum+=n;}if(sum>payment.amount)throw Error('Allocated amounts exceed the incoming payment.');return payment.amount-sum;}
};
// MODEL END
const root=document.getElementById('urbanomics-review'),main=root.querySelector('main');
const state={page:'import',imported:false,selected:'a1',people:[{id:'me',name:'You'},{id:'alex',name:'Alex'},{id:'sam',name:'Sam'}],aliases:{},groups:[{id:'weekend',name:'Mountain weekend',expenses:['dinner','cabin']}],expenses:[{id:'dinner',name:'Dinner at Juniper',date:'Sep 5',total:12000,category:'Eating out',shares:{me:12000},reviewed:false},{id:'cabin',name:'Cabin booking',date:'Sep 6',total:36000,category:'Travel',shares:{me:12000,alex:12000,sam:12000},reviewed:true},{id:'market',name:'Neighbourhood market',date:'Sep 7',total:8600,category:'Groceries',shares:{me:8600},reviewed:true},{id:'transit',name:'Transit top-up',date:'Sep 8',total:3200,category:'Transport',shares:{me:3200},reviewed:true}],payments:[{id:'a1',name:'E-transfer · ALEX SAMPLE',sender:'ALEX SAMPLE',date:'Sep 9',amount:18000,kind:'',person:'',allocations:{}},{id:'a2',name:'E-transfer · ALEX SAMPLE',sender:'ALEX SAMPLE',date:'Sep 12',amount:3000,kind:'',person:'',allocations:{}},{id:'pay',name:'Employer payroll',sender:'EMPLOYER PAYROLL',date:'Sep 15',amount:300000,kind:'',person:'',allocations:{}}]};
let draft=null;const design={density:'Comfortable'};
const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n/100);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person=id=>state.people.find(p=>p.id===id)?.name||'Unknown';
const clone=x=>JSON.parse(JSON.stringify(x));
const heading=(a,b)=>`<div class="heading"><h2>${a}</h2><p class="muted">${b}</p></div>`;
const say=s=>root.querySelector('[role=status]').textContent=s;
const pending=p=>!p.kind||(p.kind==='repayment'&&Object.values(p.allocations).reduce((a,b)=>a+b,0)<p.amount);
function openPage(page,selected){state.page=page;if(selected)state.selected=selected;draft=null;render();}
function prepare(){const p=state.payments.find(p=>p.id===state.selected);if(p){draft={...clone(p),kind:p.kind||'repayment',person:p.person||state.aliases[p.sender]||'',remember:!!state.aliases[p.sender],scope:p.scope||'expense',target:p.target||'dinner',proposed:{},allocations:clone(p.allocations),loaded:!!p.kind};if(draft.person)prepareTargets(!p.kind);}else draft=clone(state.expenses.find(e=>e.id===state.selected));}
function targetExpenses(){const ids=draft.scope==='group'?(state.groups.find(g=>g.id===draft.target)?.expenses||[]):[draft.target];return state.expenses.filter(e=>ids.includes(e.id));}
function prepareTargets(auto=true){draft.proposed={};for(const e of targetExpenses()){const copy=clone(e);if(draft.person&&!Object.hasOwn(copy.shares,draft.person))copy.shares=Model.equal(copy.total,[...Object.keys(copy.shares),draft.person]);draft.proposed[e.id]=copy;}if(auto)draft.allocations=Model.allocate(draft.amount,Object.values(draft.proposed),draft.person,state.payments,draft.id);}
function splitter(e){const ids=Object.keys(e.shares);return `<div class="splitter" data-splitter="${e.id}"><div class="band" aria-label="${esc(e.name)} share proportions">${ids.map(id=>`<span data-band="${id}" style="width:${e.shares[id]/e.total*100}%"></span>`).join('')}</div>${ids.map(id=>`<div class="share-row"><div class="line"><span>${esc(person(id))}</span><label class="share-value"><span class="muted">$</span><input aria-label="${esc(e.name+' '+person(id)+' share in dollars')}" type="number" min="0" max="${e.total/100}" step="0.01" value="${(e.shares[id]/100).toFixed(2)}" data-exact="${id}" data-exp="${e.id}" ${ids.length===1?'disabled':''}></label></div><input type="range" min="0" max="${e.total}" step="1" value="${e.shares[id]}" aria-label="${esc(e.name+' '+person(id)+' share')}" aria-valuetext="${money(e.shares[id])}" data-share="${id}" data-exp="${e.id}" ${ids.length===1?'disabled':''}></div>`).join('')}<small>Total ${money(e.total)} · Adjusting one share redistributes the rest.</small></div>`;}
function importView(){return heading('Add your monthly export','Choose a month, add your CSV, and move straight into review.')+`<section class="panel receipt"><div class="line"><strong>September 2026</strong><span class="muted">Everyday chequing</span></div><div class="file"><strong>sample-chequing-september.csv</strong><div class="subline">+ 7 rows included &nbsp; · &nbsp; − 2 outside September</div></div><div class="actions"><span class="muted">Sample file · Import simulated</span><button class="primary" id="import-sample">${state.imported?'Return to review':'Import and review'}</button></div></section>`;}
function paymentStatus(p){if(!p.kind)return state.aliases[p.sender]?person(state.aliases[p.sender])+' recognized · choose purpose':'Choose a purpose';if(p.kind==='income')return p.incomeType+' · reviewed';const remainder=p.amount-Object.values(p.allocations).reduce((a,b)=>a+b,0);return person(p.person)+' · '+(remainder?money(remainder)+' still unassigned':'repayment linked');}
function queue(){return `<aside><div class="section-label">Money in</div>${state.payments.map(p=>`<button class="item" data-review="${p.id}" aria-pressed="${state.selected===p.id}"><span>${esc(p.name)}<small>${esc(paymentStatus(p))}</small></span><span class="money">+${money(p.amount)}</span></button>`).join('')}<div class="section-label">Expenses</div>${state.expenses.map(e=>`<button class="item" data-review="${e.id}" aria-pressed="${state.selected===e.id}"><span>${esc(e.name)}<small>${e.reviewed?Object.keys(e.shares).map(person).map(esc).join(' + '):'Review category and shares'}</small></span><span class="money">${money(e.total)}</span></button>`).join('')}</aside>`;}
function incomingView(){const recognized=state.aliases[draft.sender];return `<section class="panel"><div class="eyebrow">${draft.date} · Money in</div><h3>${esc(draft.name)}</h3><div class="amount money">+${money(draft.amount)}</div><label class="field">What is this money for?<select id="purpose" aria-label="Payment purpose"><option value="repayment" ${draft.kind==='repayment'?'selected':''}>Repayment of expenses</option><option value="income" ${draft.kind==='income'?'selected':''}>Income</option></select></label>${draft.kind==='income'?`<div class="fields"><label class="field">Income bucket<select id="income-type" aria-label="Income bucket">${['General income','Job income','Selling something'].map(s=>`<option ${draft.incomeType===s?'selected':''}>${s}</option>`).join('')}</select></label></div>`:`<div class="fields"><label class="field">From<select id="sender" aria-label="Sender"><option value="">Choose a person</option>${state.people.filter(p=>p.id!=='me').map(p=>`<option value="${p.id}" ${draft.person===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Apply to<select id="scope" aria-label="Repayment scope"><option value="expense" ${draft.scope==='expense'?'selected':''}>One expense</option><option value="group" ${draft.scope==='group'?'selected':''}>A group of expenses</option></select></label></div>${recognized?`<p class="muted">${esc(person(recognized))} recognized from your saved sender rule.</p>`:''}<label class="check"><input id="remember" type="checkbox" ${draft.remember?'checked':''}>Remember “${esc(draft.sender)}” as this person</label><label class="field" style="margin-top:12px">${draft.scope==='group'?'Expense group':'Expense'}<select id="target" aria-label="Repayment target">${(draft.scope==='group'?state.groups:state.expenses).map(x=>`<option value="${x.id}" ${draft.target===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>${!draft.person?'<div class="notice">Choose who sent this payment to see their shares and link the money.</div>':`<div class="notice">${draft.scope==='group'?'One payment can settle several expenses. Suggested amounts fill the oldest expense first.':'The sender becomes a participant in this expense. Adjust the shares before saving.'}</div>${Object.values(draft.proposed).map(e=>{const newPerson=!Object.hasOwn(state.expenses.find(x=>x.id===e.id).shares,draft.person);return `<div class="allocation"><div class="line"><div><strong>${esc(e.name)}</strong><div class="subline">${e.date} · ${money(e.total)} total${newPerson?' · '+esc(person(draft.person))+' added, split equally':''}</div></div><label class="field allocate-input">Apply (CAD)<input type="number" min="0" step="0.01" value="${((draft.allocations[e.id]||0)/100).toFixed(2)}" aria-label="${esc('Apply repayment to '+e.name)}" data-allocation="${e.id}"></label></div><div class="subline" data-owed="${e.id}"></div><details ${draft.scope==='expense'?'open':''}><summary>Adjust expense shares</summary>${splitter(e)}</details></div>`}).join('')}<div class="notice" id="allocation-summary"></div>`}`}
<div class="error" id="form-error" role="alert"></div><div class="actions"><small>Changes apply when you save.</small><button class="primary" id="save-payment">${draft.kind==='income'?'Save income':'Save links and shares'}</button></div></section>`;}
function expenseView(){return `<section class="panel"><div class="eyebrow">${draft.date} · Expense</div><h3>${esc(draft.name)}</h3><div class="amount money">${money(draft.total)}</div><label class="field">Category<select id="expense-category" aria-label="Expense category">${['Eating out','Travel','Groceries','Transport'].map(c=>`<option ${draft.category===c?'selected':''}>${c}</option>`).join('')}</select></label><div class="section-label">Who shared this?</div><div class="people-chips"><span class="check">You</span>${state.people.filter(p=>p.id!=='me').map(p=>`<label class="check"><input type="checkbox" data-participant="${p.id}" ${Object.hasOwn(draft.shares,p.id)?'checked':''}>${esc(p.name)}</label>`).join('')}</div>${splitter(draft)}<div class="error" id="form-error" role="alert"></div><div class="actions"><button id="equal-shares">Split equally</button><button class="primary" id="save-expense">Save expense</button></div></section>`;}
function peopleView(){return heading('People you share with','A person connects their payments, expense shares, and what is still owed.')+`<div class="layout"><section class="panel"><h3>Add a person</h3><form id="add-person"><label class="field">Name<input id="person-name" aria-label="New person name" type="text" maxlength="40" required></label><div class="actions"><button class="primary">Add person</button></div></form></section><section class="panel">${state.people.filter(p=>p.id!=='me').map(p=>{const aliases=Object.entries(state.aliases).filter(([,id])=>id===p.id);const owed=state.expenses.reduce((s,e)=>s+Model.owed(e,p.id,state.payments),0);return `<div class="row"><div><strong>${esc(p.name)}</strong><div class="subline">${aliases.length?aliases.map(([s])=>esc(s)).join(', '):'No saved sender rule'}</div></div><div style="text-align:right"><span class="money">${money(owed)} owed</span>${aliases.map(([s])=>`<div><button data-forget="${esc(s)}">Forget sender rule</button></div>`).join('')}</div></div>`}).join('')}</section></div>`;}
function groupsView(){return heading('Shared groups','Keep a trip or a collection of expenses together. Each expense keeps its own split.')+`<div class="layout"><section class="panel"><h3>Create a group</h3><form id="add-group"><label class="field">Group name<input id="group-name" aria-label="New group name" type="text" maxlength="60" required></label><div class="actions"><button class="primary">Create group</button></div></form></section><section>${state.groups.map(g=>`<div class="panel" style="margin-bottom:14px"><h3>${esc(g.name)}</h3>${state.expenses.map(e=>`<label class="check"><input type="checkbox" data-group="${g.id}" data-member="${e.id}" ${g.expenses.includes(e.id)?'checked':''}>${esc(e.name)} · ${money(e.total)}</label>`).join('')}<div class="subline">Group membership changes immediately. Existing repayment links stay attached to their expenses.</div></div>`).join('')}</section></div>`;}
function spendingView(){const remaining=state.payments.filter(pending).length+state.expenses.filter(e=>!e.reviewed).length;if(remaining)return heading('Finish reviewing your month',`${remaining} item${remaining===1?'':'s'} still need review before the spending breakdown is ready.`)+`<button class="primary" id="resume-review">Back to review</button>`;const cats=[...new Set(state.expenses.map(e=>e.category))];return heading('Your reviewed spending','Only your shares of expenses contribute to these categories.')+`<section class="panel"><div class="line"><span>Your spending</span><span class="amount money">${money(state.expenses.reduce((s,e)=>s+e.shares.me,0))}</span></div>${cats.map(c=>`<div class="row"><span>${esc(c)}</span><span class="money">${money(state.expenses.filter(e=>e.category===c).reduce((s,e)=>s+e.shares.me,0))}</span></div>`).join('')}</section>`;}
function updateShares(e){const box=main.querySelector(`[data-splitter="${e.id}"]`);if(!box)return;Object.entries(e.shares).forEach(([id,value])=>{box.querySelector(`[data-band="${id}"]`).style.width=value/e.total*100+'%';const r=box.querySelector(`[data-share="${id}"]`),n=box.querySelector(`[data-exact="${id}"]`);r.value=value;r.setAttribute('aria-valuetext',money(value));if(document.activeElement!==n)n.value=(value/100).toFixed(2);});}
function updateAllocation(){if(!draft?.proposed)return;for(const e of Object.values(draft.proposed)){const el=main.querySelector(`[data-owed="${e.id}"]`);if(el)el.textContent=person(draft.person)+'’s unpaid share before this payment: '+money(Model.owed(e,draft.person,state.payments,draft.id));}const el=main.querySelector('#allocation-summary');if(el){const used=Object.values(draft.allocations).reduce((a,b)=>a+b,0),left=draft.amount-used;el.textContent=Number.isFinite(left)?money(used)+' linked · '+money(left)+' unassigned'+(left>0?' — stays in review.':left===0?' — fully assigned.':' — exceeds this payment.'): 'Enter valid repayment amounts.';}}
function render(){root.querySelectorAll('[data-page]').forEach(b=>{b.disabled=!state.imported&&['review','spending'].includes(b.dataset.page);if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(state.page==='review'&&!draft)prepare();main.innerHTML=state.page==='import'?importView():state.page==='people'?peopleView():state.page==='groups'?groupsView():state.page==='spending'?spendingView():heading('Review the relationships','Who is involved, what was shared, and what each payment settles.')+`<div class="layout">${queue()}${draft.amount!==undefined?incomingView():expenseView()}</div>`;if(state.page==='review')updateAllocation();if(design.density==='Compact')main.querySelectorAll('.panel').forEach(p=>p.style.padding='12px');}
function error(message){main.querySelector('#form-error').textContent=message;}
function savePayment(){try{const p=clone(draft);delete p.proposed;delete p.remember;delete p.loaded;if(p.kind==='income'){p.incomeType=main.querySelector('#income-type').value;p.person='';p.allocations={};}else{if(!p.person)throw Error('Choose the person who sent this payment.');const proposed=Object.values(draft.proposed);for(const f of main.querySelectorAll('[data-exact]')){const n=Model.cents(f.value),e=draft.proposed[f.dataset.exp];if(!Number.isInteger(n)||n<0||n>e.total)throw Error('Enter valid expense shares before saving.');}proposed.forEach(e=>Model.validateSplit(e,state.payments,p.id));Model.settle(p,proposed,state.payments);if(!Object.values(p.allocations).some(n=>n>0))throw Error('Apply some of this payment to an expense, or choose Income.');for(const e of proposed.filter(e=>p.allocations[e.id]>0)){e.reviewed=true;state.expenses[state.expenses.findIndex(x=>x.id===e.id)]=clone(e);}if(main.querySelector('#remember').checked)state.aliases[p.sender]=p.person;}state.payments[state.payments.findIndex(x=>x.id===p.id)]=p;draft=null;render();say('Payment saved.');}catch(e){error(e.message);}}
root.addEventListener('input',event=>{const el=event.target;if(el.dataset.share||el.dataset.exact){const id=el.dataset.exp,e=draft.proposed?draft.proposed[id]:draft;const value=el.dataset.share?Number(el.value):Model.cents(el.value);if(!Number.isInteger(value)||value<0||value>e.total)return;e.shares=Model.move(e.total,e.shares,el.dataset.share||el.dataset.exact,value);updateShares(e);if(draft.proposed){draft.allocations=Model.allocate(draft.amount,Object.values(draft.proposed),draft.person,state.payments,draft.id);main.querySelectorAll('[data-allocation]').forEach(x=>x.value=(draft.allocations[x.dataset.allocation]/100).toFixed(2));updateAllocation();}}if(el.dataset.allocation){draft.allocations[el.dataset.allocation]=Model.cents(el.value);updateAllocation();}});
root.addEventListener('change',event=>{const el=event.target;if(el.id==='purpose'){draft.kind=el.value;render();}else if(el.id==='sender'){draft.person=el.value;prepareTargets();render();}else if(el.id==='scope'){draft.scope=el.value;draft.target=draft.scope==='group'?state.groups[0].id:state.expenses[0].id;prepareTargets();render();}else if(el.id==='target'){draft.target=el.value;prepareTargets();render();}else if(el.id==='remember')draft.remember=el.checked;else if(el.id==='income-type')draft.incomeType=el.value;else if(el.id==='expense-category')draft.category=el.value;else if(el.dataset.participant){const ids=Object.keys(draft.shares).filter(id=>id!==el.dataset.participant);if(el.checked)ids.push(el.dataset.participant);draft.shares=Model.equal(draft.total,ids);render();}else if(el.dataset.group){const g=state.groups.find(g=>g.id===el.dataset.group);g.expenses=g.expenses.filter(id=>id!==el.dataset.member);if(el.checked)g.expenses.push(el.dataset.member);say('Group updated.');}});
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page)return openPage(b.dataset.page);if(b.dataset.review)return openPage('review',b.dataset.review);if(b.dataset.forget){delete state.aliases[b.dataset.forget];render();say('Sender rule removed.');return;}if(b.id==='import-sample'){state.imported=true;openPage('review');}if(b.id==='resume-review'){const next=state.payments.find(pending)||state.expenses.find(e=>!e.reviewed);openPage('review',next.id);}if(b.id==='save-payment')savePayment();if(b.id==='equal-shares'){draft.shares=Model.equal(draft.total,Object.keys(draft.shares));render();}if(b.id==='save-expense'){try{const fields=main.querySelectorAll('[data-exact]');for(const f of fields){const n=Model.cents(f.value);if(!Number.isInteger(n)||n<0||n>draft.total)throw Error('Enter shares between zero and the expense total.');}Model.validateSplit(draft,state.payments);draft.reviewed=true;state.expenses[state.expenses.findIndex(e=>e.id===draft.id)]=clone(draft);draft=null;render();say('Expense saved.');}catch(e){error(e.message);}}});
root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='add-person'){const name=main.querySelector('#person-name').value.trim();if(!name)return;state.people.push({id:'person'+state.people.length,name});render();say('Person added.');}if(event.target.id==='add-group'){const name=main.querySelector('#group-name').value.trim();if(!name)return;state.groups.push({id:'group'+state.groups.length,name,expenses:[]});render();say('Group created.');}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'Review spacing',options:['Comfortable','Compact']});}
})();
</script>
</div>

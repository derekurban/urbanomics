<script>
(()=>{
// MODEL START
const Model={
 cents(value){if(!/^\d+(?:\.\d{1,2})?$/.test(String(value)))return NaN;const[a,b='']=String(value).split('.');const n=Number(a)*100+Number(b.padEnd(2,'0'));return Number.isSafeInteger(n)?n:NaN;},
 equal(total,ids){const base=Math.floor(total/ids.length);return Object.fromEntries(ids.map((id,i)=>[id,base+(i<total%ids.length?1:0)]));},
 divider(total,shares,index,value){const ids=Object.keys(shares);if(!Number.isInteger(index)||index<0||index>=ids.length-1||!Number.isInteger(value))throw Error('Invalid divider');const before=ids.slice(0,index).reduce((s,id)=>s+shares[id],0),end=before+shares[ids[index]]+shares[ids[index+1]],at=Math.max(before,Math.min(end,value));return {...shares,[ids[index]]:at-before,[ids[index+1]]:end-at};},
 owed(e,person,payments,except){return(e.shares[person]||0)-payments.filter(p=>p.id!==except&&p.kind==='repayment'&&p.person===person).reduce((s,p)=>s+(p.allocations[e.id]||0),0);},
 allocate(amount,expenses,person,payments,except){let left=amount;return Object.fromEntries(expenses.map(e=>{const n=Math.min(left,Math.max(0,Model.owed(e,person,payments,except)));left-=n;return[e.id,n];}));},
 validateSplit(e,payments,except){if(Object.values(e.shares).some(n=>!Number.isInteger(n)||n<0)||Object.values(e.shares).reduce((a,b)=>a+b,0)!==e.total)throw Error('Shares must equal the expense total.');for(const p of payments.filter(p=>p.id!==except&&p.kind==='repayment'))if(Model.owed(e,p.person,payments,except)<0)throw Error('This share is below an existing repayment. Edit that repayment first.');},
 settle(p,expenses,payments){let sum=0;for(const[id,n]of Object.entries(p.allocations)){const e=expenses.find(e=>e.id===id);if(!e||!Number.isInteger(n)||n<0)throw Error('Enter valid repayment amounts.');if(n>Math.max(0,Model.owed(e,p.person,payments,p.id)))throw Error('This amount exceeds the person’s unpaid share.');sum+=n;}if(sum>p.amount)throw Error('These allocations exceed the incoming payment.');return p.amount-sum;},
 pending(p){return!p.kind||(p.kind==='repayment'&&Object.values(p.allocations).reduce((a,b)=>a+b,0)<p.amount);},
 assign(groups,expenseId,groupId){return groups.map(g=>({...g,expenses:[...g.expenses.filter(id=>id!==expenseId),...(g.id===groupId?[expenseId]:[])]}));},
 transfer(a,b){return!!a.reference&&a.reference===b.reference&&a.account!==b.account&&a.currency===b.currency&&a.amount===-b.amount;}
};
// MODEL END
const root=document.getElementById('urbanomics-inbox'),main=root.querySelector('main');
const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n/100);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const state={page:'import',imported:false,groupsReady:false,selected:'a1',inlineGroups:false,grabbed:null,toast:'',people:[{id:'me',name:'You'},{id:'alex',name:'Alex'},{id:'sam',name:'Sam'},{id:'jordan',name:'Jordan'},{id:'taylor',name:'Taylor'}],aliases:{},groups:[{id:'weekend',name:'Mountain weekend',expenses:['dinner','cabin']}],accounts:[{id:'eqc',name:'Bank A · Chequing',file:'bank-a-chequing.csv',excluded:1},{id:'eqs',name:'Bank A · Savings',file:'bank-a-savings.csv',excluded:0},{id:'tac',name:'Bank B · Chequing',file:'bank-b-chequing.csv',excluded:2},{id:'tas',name:'Bank B · Savings',file:'bank-b-savings.csv',excluded:0},{id:'mc',name:'Mastercard',file:'mastercard.csv',excluded:1}],expenses:[{id:'dinner',name:'Dinner at Juniper',account:'mc',date:'Sep 5',total:12000,category:'Eating out',shares:{me:12000},reviewed:false},{id:'cabin',name:'Cabin booking',account:'eqc',date:'Sep 6',total:36000,category:'Travel',shares:{me:12000,alex:12000,sam:12000},reviewed:false},{id:'market',name:'Neighbourhood market',account:'mc',date:'Sep 7',total:8600,category:'Groceries',shares:{me:8600},reviewed:true},{id:'transit',name:'Transit top-up',account:'tac',date:'Sep 8',total:3200,category:'Transport',shares:{me:3200},reviewed:true}],payments:[{id:'a1',name:'E-transfer · ALEX SAMPLE',sender:'ALEX SAMPLE',account:'eqc',date:'Sep 9',amount:18000,kind:'',person:'',allocations:{}},{id:'a2',name:'E-transfer · ALEX SAMPLE',sender:'ALEX SAMPLE',account:'eqc',date:'Sep 12',amount:3000,kind:'',person:'',allocations:{}},{id:'pay',name:'Employer payroll',sender:'EMPLOYER PAYROLL',account:'tac',date:'Sep 15',amount:300000,kind:'income',incomeType:'Job income',person:'',allocations:{}},{id:'interest-a',name:'Savings interest',sender:'BANK A',account:'eqs',date:'Sep 30',amount:500,kind:'income',incomeType:'General income',person:'',allocations:{}},{id:'interest-b',name:'Savings interest',sender:'BANK B',account:'tas',date:'Sep 30',amount:800,kind:'income',incomeType:'General income',person:'',allocations:{}}],transfers:[{account:'eqc',amount:-50000,currency:'CAD',reference:'SAMPLE-SAVINGS-1'},{account:'eqs',amount:50000,currency:'CAD',reference:'SAMPLE-SAVINGS-1'},{account:'tac',amount:-20000,currency:'CAD',reference:'SAMPLE-CARD-1'},{account:'mc',amount:20000,currency:'CAD',reference:'SAMPLE-CARD-1'}]};
let draft=null,undoState=null,showAddPerson=false,dragState=null,suppressClickUntil=0;
const design={density:'Comfortable'};
const person=id=>state.people.find(p=>p.id===id)?.name||'Unknown';
const account=id=>state.accounts.find(a=>a.id===id)?.name||id;
const heading=(a,b)=>`<div class="heading"><h2>${a}</h2><p class="muted">${b}</p></div>`;
const say=s=>root.querySelector('[role=status]').textContent=s;
function items(){return[...state.payments.filter(Model.pending),...state.expenses.filter(e=>!e.reviewed)];}
function openPage(page,id){if(page==='review'&&!state.groupsReady)page='groups';state.page=page;if(id)state.selected=id;draft=null;state.inlineGroups=false;render();}
function capture(){undoState=clone({expenses:state.expenses,payments:state.payments,aliases:state.aliases,selected:state.selected});}
function finish(message){state.toast=message;draft=null;state.selected=items()[0]?.id||'';render();say(message);}
function options(label,field,values,selected){return `<div class="options" role="group" aria-label="${esc(label)}">${values.map(v=>`<button data-choice="${field}" data-value="${esc(v.value)}" aria-pressed="${selected===v.value}">${esc(v.label)}</button>`).join('')}</div>`;}
function avatars(selected,multiple=false){return `<div class="avatars" role="group" aria-label="${multiple?'Expense participants':'Payment sender'}">${state.people.filter(p=>multiple||p.id!=='me').map(p=>`<button class="avatar-choice" ${p.id==='me'&&multiple?'disabled':''} data-avatar="${p.id}" data-multi="${multiple}" aria-pressed="${multiple?Object.hasOwn(selected,p.id):selected===p.id}" aria-label="${esc((multiple?'Include ':'Sender ')+p.name)}"><span class="avatar-circle" aria-hidden="true">${esc(p.name.slice(0,2).toUpperCase())}</span><span>${esc(p.name)}</span></button>`).join('')}<button class="avatar-choice" id="add-person-inline"><span class="avatar-circle" aria-hidden="true">+</span><span>Add person</span></button></div>${showAddPerson?'<form id="inline-person" class="create-group"><label class="field">Name<input id="inline-name" aria-label="New person name" type="text" maxlength="40" required></label><button>Add</button></form>':''}`;}
function prepare(){const p=state.payments.find(p=>p.id===state.selected);if(p){draft={...clone(p),kind:p.kind||'repayment',person:p.person||state.aliases[p.sender]||'',remember:!!state.aliases[p.sender],scope:p.scope||'expense',target:p.target||'dinner',proposed:{}};if(draft.person)prepareTargets(!p.kind);}else draft=clone(state.expenses.find(e=>e.id===state.selected));}
function targetExpenses(){const ids=draft.scope==='group'?(state.groups.find(g=>g.id===draft.target)?.expenses||[]):[draft.target];return state.expenses.filter(e=>ids.includes(e.id));}
function prepareTargets(auto=true){draft.proposed={};for(const e of targetExpenses()){const copy=clone(e);if(draft.person&&!Object.hasOwn(copy.shares,draft.person))copy.shares=Model.equal(copy.total,[...Object.keys(copy.shares),draft.person]);draft.proposed[e.id]=copy;}if(auto)draft.allocations=Model.allocate(draft.amount,Object.values(draft.proposed),draft.person,state.payments,draft.id);}
function splitUI(e){const ids=Object.keys(e.shares);let boundary=0;return `<div class="splitter" data-splitter="${e.id}"><div class="split-labels">${ids.map(id=>`<div><small>${esc(person(id))}</small><strong data-share-label="${id}">${money(e.shares[id])}</strong></div>`).join('')}</div><div class="divider-track"><div class="divider-band" aria-label="${esc(e.name)} split">${ids.map(id=>`<span data-segment="${id}" style="width:${e.shares[id]/e.total*100}%"></span>`).join('')}</div>${ids.slice(0,-1).map((id,i)=>{boundary+=e.shares[id];return `<input class="divider" type="range" min="0" max="${e.total}" step="1" value="${boundary}" aria-label="${esc(e.name+' divider '+person(id)+' and '+person(ids[i+1]))}" aria-valuetext="${money(e.shares[id])+' '+esc(person(id))+', '+money(e.shares[ids[i+1]])+' '+esc(person(ids[i+1]))}" data-divider="${i}" data-exp="${e.id}">`;}).join('')}</div><small>${ids.length>1?'Drag a divider. Only its two neighbours change.':'Add someone to split this expense.'} Total ${money(e.total)}.</small>${ids.length>1?`<details><summary>Fine-tune divider positions</summary>${ids.slice(0,-1).map((id,i)=>`<label class="boundary-row">${esc(person(id)+' / '+person(ids[i+1]))}<input type="number" min="0" max="${e.total/100}" step="0.01" value="${(ids.slice(0,i+1).reduce((s,k)=>s+e.shares[k],0)/100).toFixed(2)}" aria-label="${esc(e.name+' divider after '+person(id)+' in dollars')}" data-boundary="${i}" data-exp="${e.id}"></label>`).join('')}</details>`:''}</div>`;}
function importView(){return heading('Bring in your month','Add exports together. Each file goes to its saved account profile.')+`<section class="panel receipt"><div class="line"><strong>September 2026</strong><span class="tag">Five sample accounts</span></div>${state.accounts.map(a=>{const n=state.expenses.filter(e=>e.account===a.id).length+state.payments.filter(p=>p.account===a.id).length+state.transfers.filter(t=>t.account===a.id).length;return `<div class="account-file"><div><strong>${esc(a.file)}</strong><small>${esc(a.name)} · + ${n} included · − ${a.excluded} outside month</small></div><span class="tag">Recognized</span></div>`;}).join('')}<div class="actions"><small>Sample batch · Account routing and import simulated</small><button class="primary" id="import-batch">${state.imported?'Continue to groups':'Import all 5 files'}</button></div></section>`;}
function groupBoard(){const assigned=new Set(state.groups.flatMap(g=>g.expenses));const zones=[{id:'',name:'Ungrouped',expenses:state.expenses.filter(e=>!assigned.has(e.id)).map(e=>e.id)},...state.groups];return `<div class="group-board">${zones.map(g=>`<section class="drop-zone" data-drop="${g.id}" aria-label="${esc(g.name+' expense group')}"><div class="drop-head"><h3>${esc(g.name)}</h3>${state.grabbed?`<button data-destination="${g.id}">${g.id?'Move here':'Remove from group'}</button>`:''}</div>${g.expenses.map(id=>{const e=state.expenses.find(e=>e.id===id);return `<button class="item" draggable="false" data-grab="${id}" aria-pressed="${state.grabbed===id}"><span>${esc(e.name)}<small>${esc(account(e.account))}</small></span><span class="money">${money(e.total)}</span></button>`;}).join('')||'<small>Drop an expense here.</small>'}</section>`).join('')}</div><form id="new-group" class="create-group"><label class="field">New group<input id="group-name" type="text" aria-label="Group name" placeholder="e.g. Mountain weekend" maxlength="60" required></label><button>Create group</button></form>`;}
function groupsView(){return heading(state.groupsReady?'Your expense groups':'Set up your shared groups','Drag expenses into a group, or select an expense and then choose its destination.')+`<section class="group-editor">${groupBoard()}</section>${state.imported?`<div class="actions"><span class="muted">You can adjust groups during review.</span><button class="primary" id="begin-review">${state.groupsReady?'Back to review':'Groups ready · Start review'}</button></div>`:''}`;}
function queue(){const moneyIn=state.payments.filter(Model.pending),moneyOut=state.expenses.filter(e=>!e.reviewed);return `<aside><div class="line"><h3>Needs attention</h3><span class="tag">${items().length}</span></div><div class="section-label">Money in · ${moneyIn.length}</div>${moneyIn.map(p=>`<button class="item" data-review="${p.id}" aria-pressed="${state.selected===p.id}"><span>${esc(p.name)}<small>${esc(account(p.account))}</small><small>${p.kind==='repayment'?money(p.amount-Object.values(p.allocations).reduce((a,b)=>a+b,0))+' unassigned':state.aliases[p.sender]?esc(person(state.aliases[p.sender]))+' recognized':'Choose a purpose'}</small></span><span class="money">+${money(p.amount)}</span></button>`).join('')||'<small>All clear.</small>'}<div class="section-label">Money out · ${moneyOut.length}</div>${moneyOut.map(e=>`<button class="item" data-review="${e.id}" aria-pressed="${state.selected===e.id}"><span>${esc(e.name)}<small>${esc(account(e.account))}</small></span><span class="money">−${money(e.total)}</span></button>`).join('')||'<small>All clear.</small>'}<p class="subline" style="margin-top:20px">Saved rules handled pay, interest, groceries and transit. Two own-account movements are matched in this sample.</p></aside>`;}
function incomingView(){return `<section class="panel"><div class="eyebrow">${draft.date} · ${esc(account(draft.account))}</div><h3>${esc(draft.name)}</h3><div class="amount money">+${money(draft.amount)}</div><small>What is this money for?</small>${options('Payment purpose','kind',[{value:'repayment',label:'Repayment'},{value:'income',label:'Income'}],draft.kind)}${draft.kind==='income'?`<small>Income bucket</small>${options('Income bucket','incomeType',['General income','Job income','Selling something'].map(v=>({value:v,label:v})),draft.incomeType||'General income')}`:`<small>Who sent it?</small>${avatars(draft.person)}${draft.person?`<label class="check"><input id="remember" type="checkbox" ${draft.remember?'checked':''}>Remember “${esc(draft.sender)}” as ${esc(person(draft.person))}</label><div style="margin-top:16px"><small>What does it settle?</small>${options('Repayment scope','scope',[{value:'expense',label:'One expense'},{value:'group',label:'A group of expenses'}],draft.scope)}</div><div class="target-list" role="group" aria-label="Repayment target">${(draft.scope==='group'?state.groups:state.expenses).map(e=>`<button data-choice="target" data-value="${e.id}" aria-pressed="${draft.target===e.id}">${esc(e.name)}${e.total?' · '+money(e.total):''}</button>`).join('')}</div>${Object.values(draft.proposed).map(e=>`<div class="allocation"><div class="line"><div><strong>${esc(e.name)}</strong><div class="subline">${money(e.total)} total${!Object.hasOwn(state.expenses.find(x=>x.id===e.id).shares,draft.person)?' · '+esc(person(draft.person))+' added to split':''}</div></div><label class="field allocate-input">Apply (CAD)<input type="number" min="0" step="0.01" value="${((draft.allocations[e.id]||0)/100).toFixed(2)}" aria-label="${esc('Apply to '+e.name)}" data-allocation="${e.id}"></label></div><small data-owed="${e.id}"></small><details ${draft.scope==='expense'?'open':''}><summary>Expense split</summary>${splitUI(e)}</details></div>`).join('')}<div class="notice" id="allocation-summary"></div>`:'<p class="muted">Select a person to choose the expense or group.</p>'}`}
<div class="error" id="form-error" role="alert"></div><div class="actions"><small>Save to clear this task.</small><button class="primary" id="save-payment">${draft.kind==='income'?'Save income':'Save repayment'}</button></div></section>`;}
function expenseView(){const group=state.groups.find(g=>g.expenses.includes(draft.id));return `<section class="panel"><div class="eyebrow">${draft.date} · ${esc(account(draft.account))}</div><h3>${esc(draft.name)}</h3><div class="amount money">${money(draft.total)}</div><small>Category</small>${options('Expense category','category',['Eating out','Travel','Groceries','Transport'].map(v=>({value:v,label:v})),draft.category)}<small>Who shared this?</small>${avatars(draft.shares,true)}${splitUI(draft)}<div class="section-label">Group</div><div class="options" role="group" aria-label="Expense group">${[{id:'',name:'No group'},...state.groups].map(g=>`<button data-expense-group="${g.id}" aria-pressed="${(group?.id||'')===g.id}">${esc(g.name)}</button>`).join('')}<button id="manage-inline">Manage groups</button></div><small>Group membership is saved immediately.</small><div class="error" id="form-error" role="alert"></div><div class="actions"><button id="equal-shares">Split equally</button><button class="primary" id="save-expense">Save expense</button></div></section>`;}
function reviewView(){if(items().length&&!items().some(x=>x.id===state.selected)){state.selected=items()[0].id;draft=null;}if(items().length&&!draft)prepare();return `<div class="review-title"><div><h2>Clear your review inbox</h2><span class="muted">Only the money movements that need a decision.</span></div><button id="toggle-groups">${state.inlineGroups?'Close group editor':'Manage groups'}</button></div>${state.toast?`<div class="success-line"><span>${esc(state.toast)}</span>${undoState?'<button id="undo-review">Undo last review</button>':''}</div>`:''}${state.inlineGroups?`<section class="group-editor"><h3>Manage groups</h3><small>Drag an expense, or select it and choose a destination.</small>${groupBoard()}</section>`:''}${items().length?`<div class="layout">${queue()}${draft.amount!==undefined?incomingView():expenseView()}</div>`:`<div class="empty"><h3>You’re all caught up.</h3><p class="muted">Every imported movement has a purpose.</p><button class="primary" id="see-spending">See reviewed spending</button></div>`}`;}
function peopleView(){return heading('People','Saved senders and outstanding shares across your accounts.')+`<div class="panel">${state.people.filter(p=>p.id!=='me').map(p=>`<div class="row"><div class="line"><span class="avatar-circle">${esc(p.name.slice(0,2).toUpperCase())}</span><span>${esc(p.name)}<small style="display:block">${Object.entries(state.aliases).filter(([,id])=>id===p.id).map(([key])=>esc(key)).join(', ')||'No saved sender'}</small></span></div><span class="money">${money(state.expenses.reduce((s,e)=>s+Model.owed(e,p.id,state.payments),0))} owed</span></div>`).join('')}<form id="new-person" class="create-group"><label class="field">Name<input id="person-name" aria-label="New person name" type="text" maxlength="40" required></label><button>Add person</button></form></div>`;}
function spendingView(){if(items().length)return heading('Finish your review first',`${items().length} items still need your attention.`)+'<button class="primary" id="resume-review">Back to review</button>';return heading('Your reviewed spending','Your share across all five sample accounts. Transfers and card payments are excluded.')+`<section class="panel"><div class="line"><span>Personal spending</span><span class="amount money">${money(state.expenses.reduce((s,e)=>s+e.shares.me,0))}</span></div>${[...new Set(state.expenses.map(e=>e.category))].map(c=>`<div class="row"><span>${esc(c)}</span><span class="money">${money(state.expenses.filter(e=>e.category===c).reduce((s,e)=>s+e.shares.me,0))}</span></div>`).join('')}</section>`;}
function updateSplit(e){const box=main.querySelector(`[data-splitter="${e.id}"]`);if(!box)return;const ids=Object.keys(e.shares);let boundary=0;ids.forEach((id,i)=>{box.querySelector(`[data-segment="${id}"]`).style.width=e.shares[id]/e.total*100+'%';box.querySelector(`[data-share-label="${id}"]`).textContent=money(e.shares[id]);boundary+=e.shares[id];if(i<ids.length-1){const r=box.querySelector(`[data-divider="${i}"]`),n=box.querySelector(`[data-boundary="${i}"]`);r.value=boundary;r.setAttribute('aria-valuetext',money(e.shares[id])+' '+person(id)+', '+money(e.shares[ids[i+1]])+' '+person(ids[i+1]));if(document.activeElement!==n)n.value=(boundary/100).toFixed(2);}});}
function updateAllocation(){if(!draft?.proposed)return;for(const e of Object.values(draft.proposed)){const x=main.querySelector(`[data-owed="${e.id}"]`);if(x)x.textContent=person(draft.person)+'’s unpaid share before this payment: '+money(Model.owed(e,draft.person,state.payments,draft.id));}const box=main.querySelector('#allocation-summary');if(box){const used=Object.values(draft.allocations).reduce((a,b)=>a+b,0),left=draft.amount-used;box.textContent=Number.isFinite(left)?money(used)+' applied · '+money(left)+' unassigned'+(left>0?' — remains in your inbox.':left===0?' — ready to clear.':' — exceeds the payment.'):'Enter valid amounts.';}}
function render(){root.querySelectorAll('[data-page]').forEach(b=>{b.disabled=!state.imported&&['review','spending','groups'].includes(b.dataset.page);if(state.page===b.dataset.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.innerHTML=state.page==='import'?importView():state.page==='groups'?groupsView():state.page==='review'?reviewView():state.page==='people'?peopleView():spendingView();if(state.page==='review')updateAllocation();if(design.density==='Compact')main.querySelectorAll('.panel').forEach(p=>p.style.padding='12px');}
function error(message){main.querySelector('#form-error').textContent=message;}
function validateInputs(){for(const n of main.querySelectorAll('[data-boundary]')){const value=Model.cents(n.value),e=draft.proposed?draft.proposed[n.dataset.exp]:draft;if(!Number.isInteger(value)||value<0||value>e.total)throw Error('Enter a valid divider position within the expense total.');const actual=Object.values(e.shares).slice(0,Number(n.dataset.boundary)+1).reduce((a,b)=>a+b,0);if(value!==actual)throw Error('A divider cannot cross its neighbour. Choose a position between the adjacent dividers.');}}
function savePayment(){try{const p=clone(draft);delete p.proposed;delete p.remember;const proposed=Object.values(draft.proposed||{});if(p.kind==='income'){p.incomeType=p.incomeType||'General income';p.person='';p.allocations={};}else{if(!p.person)throw Error('Select the person who sent this payment.');validateInputs();proposed.forEach(e=>Model.validateSplit(e,state.payments,p.id));Model.settle(p,proposed,state.payments);if(!Object.values(p.allocations).some(n=>n>0))throw Error('Apply money to an outstanding expense or choose Income.');}capture();if(p.kind==='repayment'){for(const e of proposed.filter(e=>p.allocations[e.id]>0)){e.reviewed=true;state.expenses[state.expenses.findIndex(x=>x.id===e.id)]=clone(e);}if(draft.remember)state.aliases[p.sender]=p.person;}state.payments[state.payments.findIndex(x=>x.id===p.id)]=p;finish(Model.pending(p)?'Saved the links. The unassigned amount still needs a purpose.':'Payment reviewed.');}catch(e){error(e.message);}}
function moveExpense(id,group){state.groups=Model.assign(state.groups,id,group);state.grabbed=null;if(draft?.proposed&&draft.person)prepareTargets();render();say('Expense group updated.');}
root.addEventListener('pointerdown',event=>{const item=event.target.closest('[data-grab]');if(!item||event.button!==0)return;item.draggable=false;dragState={id:item.dataset.grab,x:event.clientX,y:event.clientY,pointer:event.pointerId,item,moved:false};item.setPointerCapture(event.pointerId);});
root.addEventListener('pointermove',event=>{if(!dragState||event.pointerId!==dragState.pointer)return;if(Math.hypot(event.clientX-dragState.x,event.clientY-dragState.y)>6)dragState.moved=true;if(!dragState.moved)return;event.preventDefault();root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]')?.classList.add('drag-over');});
root.addEventListener('pointerup',event=>{if(!dragState||event.pointerId!==dragState.pointer)return;const current=dragState;dragState=null;if(current.item.hasPointerCapture(event.pointerId))current.item.releasePointerCapture(event.pointerId);root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(!current.moved)return;suppressClickUntil=performance.now()+150;const zone=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]');if(zone)moveExpense(current.id,zone.dataset.drop);});
root.addEventListener('pointercancel',()=>{dragState=null;root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
root.addEventListener('input',event=>{const el=event.target;if(el.dataset.divider!==undefined||el.dataset.boundary!==undefined){const e=draft.proposed?draft.proposed[el.dataset.exp]:draft,index=Number(el.dataset.divider??el.dataset.boundary),value=el.dataset.divider!==undefined?Number(el.value):Model.cents(el.value);if(!Number.isInteger(value)||value<0||value>e.total)return;e.shares=Model.divider(e.total,e.shares,index,value);updateSplit(e);const errorBox=main.querySelector('#form-error');if(errorBox)errorBox.textContent='';if(draft.proposed){draft.allocations=Model.allocate(draft.amount,Object.values(draft.proposed),draft.person,state.payments,draft.id);main.querySelectorAll('[data-allocation]').forEach(x=>x.value=((draft.allocations[x.dataset.allocation]||0)/100).toFixed(2));updateAllocation();}}if(el.dataset.allocation){draft.allocations[el.dataset.allocation]=Model.cents(el.value);updateAllocation();}});
root.addEventListener('change',event=>{if(event.target.id==='remember')draft.remember=event.target.checked;});
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page)return openPage(b.dataset.page);if(b.dataset.review){state.selected=b.dataset.review;draft=null;render();return;}if(b.dataset.choice){const field=b.dataset.choice;draft[field]=b.dataset.value;if(field==='scope')draft.target=draft.scope==='group'?state.groups[0]?.id||'':state.expenses[0].id;if(['scope','target'].includes(field))prepareTargets();render();return;}if(b.dataset.avatar){if(b.dataset.multi==='true'){const ids=Object.keys(draft.shares).filter(id=>id!==b.dataset.avatar);if(!Object.hasOwn(draft.shares,b.dataset.avatar))ids.push(b.dataset.avatar);draft.shares=Model.equal(draft.total,ids);}else{draft.person=b.dataset.avatar;prepareTargets();}render();return;}if(b.dataset.grab){if(performance.now()<suppressClickUntil)return;state.grabbed=state.grabbed===b.dataset.grab?null:b.dataset.grab;render();return;}if(b.dataset.destination!==undefined)return moveExpense(state.grabbed,b.dataset.destination);if(b.dataset.expenseGroup!==undefined)return moveExpense(draft.id,b.dataset.expenseGroup);switch(b.id){case'import-batch':state.imported=true;openPage('groups');break;case'begin-review':state.groupsReady=true;openPage('review');break;case'toggle-groups':case'manage-inline':state.inlineGroups=!state.inlineGroups;render();break;case'add-person-inline':showAddPerson=!showAddPerson;render();break;case'equal-shares':draft.shares=Model.equal(draft.total,Object.keys(draft.shares));render();break;case'save-payment':savePayment();break;case'save-expense':try{validateInputs();Model.validateSplit(draft,state.payments);capture();draft.reviewed=true;state.expenses[state.expenses.findIndex(e=>e.id===draft.id)]=clone(draft);finish('Expense reviewed.');}catch(e){error(e.message);}break;case'undo-review':if(undoState){state.expenses=undoState.expenses;state.payments=undoState.payments;state.aliases=undoState.aliases;state.selected=undoState.selected;undoState=null;draft=null;state.toast='Last review undone.';render();}break;case'see-spending':openPage('spending');break;case'resume-review':openPage('review');break;}});
root.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='new-group'){const name=main.querySelector('#group-name').value.trim();if(!name)return;state.groups.push({id:'group'+state.groups.length,name,expenses:[]});render();say('Group created.');}if(['new-person','inline-person'].includes(event.target.id)){const field=event.target.querySelector('input'),name=field.value.trim();if(!name)return;state.people.push({id:'person'+state.people.length,name});showAddPerson=false;render();say('Person added.');}});
root.addEventListener('dragstart',event=>{const item=event.target.closest('[data-grab]');if(!item)return;state.grabbed=item.dataset.grab;event.dataTransfer.setData('text/plain',item.dataset.grab);event.dataTransfer.effectAllowed='move';});
root.addEventListener('dragover',event=>{const zone=event.target.closest('[data-drop]');if(zone){event.preventDefault();event.dataTransfer.dropEffect='move';zone.classList.add('drag-over');}});
root.addEventListener('dragleave',event=>{event.target.closest('[data-drop]')?.classList.remove('drag-over');});
root.addEventListener('drop',event=>{const zone=event.target.closest('[data-drop]');if(!zone)return;event.preventDefault();const id=event.dataTransfer.getData('text/plain');if(state.expenses.some(e=>e.id===id))moveExpense(id,zone.dataset.drop);});
root.addEventListener('dragend',()=>{root.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'Review spacing',options:['Comfortable','Compact']});}
})();


</script>
</div>

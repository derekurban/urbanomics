<script>
(()=>{
// MODEL START
const Model={
 cents(v){if(!/^\d+(?:\.\d{1,2})?$/.test(String(v)))return NaN;const[a,b='']=String(v).split('.');const n=Number(a)*100+Number(b.padEnd(2,'0'));return Number.isSafeInteger(n)?n:NaN;},
 equal(total,ids){if(!ids.length)return {};const q=Math.floor(total/ids.length);return Object.fromEntries(ids.map((id,i)=>[id,q+(i<total%ids.length?1:0)]));},
 sum(values){return Object.values(values).reduce((a,b)=>a+b,0);},
 rowTotal(r){return r.amount??r.total;},
 direction(r){return r.kind==='transfer'?'moved':r.total!==undefined?'out':'in';},
 expand(selected,groups,expenses){const eligible=new Set(expenses.map(e=>e.id)),seen=new Set();for(const key of selected){const [kind,id]=key.split(':');const ids=kind==='g'?(groups.find(g=>g.id===id)?.members||[]):[id];for(const leaf of ids)if(eligible.has(leaf))seen.add(leaf);}return [...seen];},
 paid(expenseId,payments,except,person){return payments.filter(p=>p.id!==except&&p.balanced&&(!person||p.person===person)).reduce((s,p)=>s+(p.allocations[expenseId]||0),0);},
 capacity(e,payments,except,person){const unclaimed=Math.max(0,e.total-Model.paid(e.id,payments,except));return e.shares?Math.min(unclaimed,Math.max(0,(e.shares[person]||0)-Model.paid(e.id,payments,except,person))):unclaimed;},
 distribute(total,capacities){const ids=Object.keys(capacities),out=Object.fromEntries(ids.map(id=>[id,0]));let remaining=total,active=ids.filter(id=>capacities[id]>0);while(remaining>0&&active.length){const portion=Math.floor(remaining/active.length),remainder=remaining%active.length;let used=0;active.forEach((id,i)=>{const add=Math.min(capacities[id]-out[id],portion+(i<remainder?1:0));out[id]+=add;used+=add;});remaining-=used;active=active.filter(id=>out[id]<capacities[id]);if(!used)break;}return {...out,income:remaining};},
 divider(values,index,value,precision=1,capacities={}){const ids=Object.keys(values);if(!Number.isInteger(index)||index<0||index>=ids.length-1||!Number.isFinite(value))throw Error('Invalid divider');const before=ids.slice(0,index).reduce((s,id)=>s+values[id],0),a=ids[index],b=ids[index+1],combined=values[a]+values[b],min=Math.max(0,combined-(capacities[b]??Infinity)),max=Math.min(combined,capacities[a]??Infinity);const snapped=Math.round(value/precision)*precision;const first=Math.max(min,Math.min(max,snapped-before));return {...values,[a]:first,[b]:combined-first};},
 savePayment(payment,draft,expenses,payments){const allocations={};let sum=0;for(const[id,amount]of Object.entries(draft.values)){if(id==='income')continue;const e=expenses.find(e=>e.id===id);if(!e||!Number.isInteger(amount)||amount<0)throw Error('Enter valid allocation amounts.');if(amount>Model.capacity(e,payments,payment.id,draft.person))throw Error('Allocation exceeds the available expense or agreed share.');if(amount)allocations[id]=amount;sum+=amount;}const income=draft.values.income;if(!Number.isInteger(income)||income<0||sum+income!==payment.amount)throw Error('Allocations and transfer income must equal the payment.');return {...payment,person:draft.person,allocations,income,kind:draft.kind,targets:[...draft.targets],balanced:true};},
 validateShares(e,payments){if(!e.shares)return;if(Object.values(e.shares).some(n=>!Number.isInteger(n)||n<0)||Model.sum(e.shares)!==e.total)throw Error('Shares must equal the full expense.');for(const p of payments.filter(p=>p.balanced&&p.allocations[e.id]))if(Model.paid(e.id,payments,undefined,p.person)>(e.shares[p.person]||0))throw Error('The agreed share is below money already repaid.');},
 personal(e,payments){return e.shares?e.shares.me:e.total-Model.paid(e.id,payments);},
 groupRows(groups,ids,groupId){return groups.map(g=>g.id===groupId?{...g,members:[...new Set([...g.members,...ids])]}:g);},
 toggleTargets(selected,key,groups,expenses){const ids=Model.expand([key],groups,expenses),set=new Set(Model.expand(selected,groups,expenses)),all=ids.length&&ids.every(id=>set.has(id));for(const id of ids)if(all)set.delete(id);else set.add(id);return [...set].map(id=>'e:'+id);},
 targetState(selected,key,groups,expenses){const ids=Model.expand([key],groups,expenses),set=new Set(Model.expand(selected,groups,expenses)),count=ids.filter(id=>set.has(id)).length;return {count,total:ids.length,checked:count===0?'false':count===ids.length?'true':'mixed'};},
 // Transaction tags: portions of one transaction, always summing to its exact amount.
 tagged(r){return Object.keys(r.tags||{}).length>0;},
 setTags(r,values){const total=Model.rowTotal(r);if(Object.values(values).some(v=>!Number.isInteger(v)||v<0)||Model.sum(values)!==total)throw Error('Tag amounts must equal the transaction total.');return {...r,tags:{...values}};},
 isEqualSplit(values,total){const ids=Object.keys(values);if(!ids.length)return true;const target=Model.equal(total,ids),a=ids.map(id=>values[id]).sort((x,y)=>x-y),b=ids.map(id=>target[id]).sort((x,y)=>x-y);return a.every((v,i)=>v===b[i]);},
 retag(values,total,ids){const previous=Object.keys(values),added=ids.filter(id=>!previous.includes(id)),removed=previous.filter(id=>!ids.includes(id));if(!ids.length)return {tags:{},kept:false,added,removed};if(Model.isEqualSplit(values,total))return {tags:Model.equal(total,ids),kept:false,added,removed};let pool=0;const kept={};for(const id of previous){if(ids.includes(id))kept[id]=values[id];else pool+=values[id];}const share=Model.equal(pool,added.length?added:ids);return {tags:Object.fromEntries(ids.map(id=>[id,(kept[id]||0)+(share[id]||0)])),kept:true,added,removed};},
 moveTag(r,source,destination){if(source===destination)return r;const values={...r.tags};if(!Object.keys(values).length)return {...r,tags:{[destination]:Model.rowTotal(r)}};if(!source||!Object.hasOwn(values,source))return r;values[destination]=(values[destination]||0)+values[source];delete values[source];return Model.setTags(r,values);},
 // Tag definitions are reusable and independent of any category view.
 slug(prefix,name,taken){const base=prefix+'-'+String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let id=base,i=2;while(taken.includes(id))id=base+'-'+i++;return id;},
 addTag(tags,name){const n=String(name).trim();if(!n)throw Error('Enter a tag name.');if(tags.some(t=>t.name.toLowerCase()===n.toLowerCase()))throw Error('That tag already exists.');return [...tags,{id:Model.slug('tag',n,tags.map(t=>t.id)),name:n}];},
 renameTag(tags,id,name){const n=String(name).trim();if(!n)throw Error('Enter a tag name.');if(tags.some(t=>t.id!==id&&t.name.toLowerCase()===n.toLowerCase()))throw Error('Another tag already uses that name.');return tags.map(t=>t.id===id?{...t,name:n}:t);},
 tagUsage(rows,id){return rows.filter(r=>Object.hasOwn(r.tags||{},id)).length;},
 removeTag(tags,views,rows,id){if(Model.tagUsage(rows,id))throw Error('Move its transaction portions to another tag first.');return {tags:tags.filter(t=>t.id!==id),views:views.map(v=>({...v,tags:v.tags.filter(t=>t!==id)}))};},
 // Category views are insight lenses over chosen tags; they never touch transactions.
 addView(views,name,tagIds=[]){const n=String(name).trim();if(!n)throw Error('Enter a view name.');if(views.some(v=>v.name.toLowerCase()===n.toLowerCase()))throw Error('That view already exists.');return [...views,{id:Model.slug('view',n,views.map(v=>v.id)),name:n,tags:[...new Set(tagIds)]}];},
 renameView(views,id,name){const n=String(name).trim();if(!n)throw Error('Enter a view name.');if(views.some(v=>v.id!==id&&v.name.toLowerCase()===n.toLowerCase()))throw Error('Another view already uses that name.');return views.map(v=>v.id===id?{...v,name:n}:v);},
 toggleViewTag(views,id,tagId){return views.map(v=>v.id!==id?v:{...v,tags:v.tags.includes(tagId)?v.tags.filter(t=>t!==tagId):[...v.tags,tagId]});},
 removeView(views,id){return views.filter(v=>v.id!==id);},
 // Financial purpose comes from review decisions, never from tags.
 purpose(r){if(r.kind==='transfer')return {code:'transfer',label:'Internal transfer · not spending or income',bucket:'moved',earned:false};if(r.total!==undefined)return {code:'expense',label:'Expense',bucket:'out',earned:false};if(!r.balanced)return {code:'unreviewed',label:'Money in · purpose not reviewed',bucket:'unreviewed',earned:false};if(r.kind==='income')return {code:'income',label:'Income',bucket:'earned',earned:true};const applied=Model.sum(r.allocations||{});if(applied&&r.income)return {code:'mixed',label:'Repayment + unassigned e-transfer income',bucket:'mixed',earned:false};if(applied)return {code:'repayment',label:'Repayment of expenses',bucket:'repaid',earned:false};return {code:'unassigned',label:'Unassigned e-transfer income',bucket:'unassigned',earned:false};},
 flows(rows,tagIds){const set=new Set(tagIds),f={out:0,in:0,moved:0,earned:0,repaid:0,mixed:0,unassigned:0,unreviewed:0,count:0,byTag:{}};for(const r of rows){const p=Model.purpose(r);let hit=false;for(const [tag,n] of Object.entries(r.tags||{})){if(!set.has(tag))continue;hit=true;const t=f.byTag[tag]??={out:0,in:0,moved:0,count:0};t.count++;if(p.bucket==='out'){f.out+=n;t.out+=n;}else if(p.bucket==='moved'){f.moved+=n;t.moved+=n;}else{f.in+=n;t.in+=n;f[p.bucket]+=n;}}if(hit)f.count++;}return f;},
 combine(rows,views){const counts={};for(const v of views)for(const t of v.tags)counts[t]=(counts[t]||0)+1;const tags=Object.keys(counts);return {...Model.flows(rows,tags),tags,overlap:tags.filter(t=>counts[t]>1)};},
 viewRows(rows,tagIds){const set=new Set(tagIds);return rows.flatMap(r=>{const portions=Object.fromEntries(Object.entries(r.tags||{}).filter(([t])=>set.has(t)));if(!Object.keys(portions).length)return [];return [{id:r.id,name:r.name,account:r.account,date:r.date,total:Model.rowTotal(r),inView:Model.sum(portions),portions,purpose:Model.purpose(r),direction:Model.direction(r)}];});},
 untagged(rows){return rows.filter(r=>!Model.tagged(r));}
};

function targetList(){const q=state.query.trim().toLowerCase(),candidates=[...state.groups.map(g=>({key:'g:'+g.id,name:g.name,type:'Event',sub:g.members.filter(id=>state.expenses.some(e=>e.id===id)).map(id=>state.expenses.find(e=>e.id===id).name).join(' · ')})),...state.expenses.map(e=>({key:'e:'+e.id,name:e.name,type:'Expense',sub:tagLabel(e)+' · '+money(e.total)}))];return candidates.filter(c=>(c.name+' '+c.type+' '+c.sub).toLowerCase().includes(q)).map(c=>{const s=Model.targetState(draft.targets,c.key,state.groups,state.expenses);return `<button class="picker-row" data-target="${c.key}" aria-pressed="${s.checked}" ${!s.total?'disabled':''}><span><span class="type-mark">${c.type}</span>${esc(c.name)}<small>${esc(c.sub)}</small>${c.type==='Event'?`<small>${s.count} of ${s.total} expenses selected</small>`:''}</span><span class="tick" aria-hidden="true">${s.checked==='true'?'✓':s.checked==='mixed'?'−':''}</span></button>`;}).join('')||'<p class="muted">No matching expenses or events.</p>';}
function avatars(selected,multiple=false){return `<div class="avatars" role="group" aria-label="${multiple?'Expense participants':'Payment sender'}">${state.people.filter(p=>multiple||p.id!=='me').map(p=>`<button class="avatar-choice" data-person="${p.id}" data-multiple="${multiple}" ${multiple&&p.id==='me'?'disabled':''} aria-pressed="${multiple?Object.hasOwn(selected,p.id):selected===p.id}" aria-label="${esc((multiple?'Include ':'Sender ')+p.name)}"><span class="avatar-circle">${esc(p.name.slice(0,2).toUpperCase())}</span><span>${esc(p.name)}</span></button>`).join('')}</div>`;}
function paymentEditor(){const known=state.aliases[draft.sender];return `<section class="panel"><div class="eyebrow">${draft.date} · ${esc(draft.account)}</div><h3>${esc(draft.name)}</h3><div class="amount money">+${money(draft.amount)}</div><div class="chips"><span class="chip">${esc(tagLabel(draft))}</span>${memberships(draft.id).map(g=>`<span class="chip event">${esc(g.name)}</span>`).join('')}</div>${options('Payment purpose','kind',[{value:'repayment',label:'Repayment / shared costs'},{value:'income',label:'Income'}],draft.kind)}${draft.kind==='income'?`<div class="notice">${money(draft.amount)} will be recorded as income. Its tags (${esc(tagLabel(draft))}) only describe it.</div>`:`<small>Who sent it?</small>${avatars(draft.person)}${draft.person?`<label class="check"><input id="remember" type="checkbox" ${draft.remember?'checked':''}>Remember “${esc(draft.sender)}” as ${esc(person(draft.person))}</label>${known?'<small>Recognized from a saved sender rule.</small>':''}<div class="section-label">What does this payment cover?</div><input class="query" type="text" id="target-search" aria-label="Search expenses and events" placeholder="Search expenses and events…" value="${esc(state.query)}"><div class="picker-list" id="target-list">${targetList()}</div><div class="line"><h3>Where the money goes</h3><button id="distribute">Distribute evenly</button></div><p class="subline">${Model.expand(draft.targets,state.groups,state.expenses).length} unique expenses selected · Event and expense checkmarks stay in sync.</p>${balanceBar(draft.values,draft.amount,id=>id==='income'?'Unassigned e-transfer income':state.expenses.find(e=>e.id===id)?.name||id,'payment')}<div class="notice" id="payment-preview"></div>`:'<p class="muted">Select the sender to find expenses and events.</p>'}`}<div class="error" role="alert" id="form-error"></div><div class="actions"><small>Expense review stays separate.</small><button class="primary" id="save-payment">${draft.kind==='income'?'Save income':'Save allocation'}</button></div></section>`;}
function expenseEditor(){const repayments=Model.paid(draft.id,state.payments),own=Model.personal(draft,state.payments);return `<section class="panel"><div class="eyebrow">${draft.date} · ${esc(draft.account)}</div><h3>${esc(draft.name)}</h3><div class="amount money">${money(draft.total)}</div><div class="chips"><span class="chip">${esc(tagLabel(draft))}</span>${memberships(draft.id).map(g=>`<span class="chip event">${esc(g.name)}</span>`).join('')}</div>${options('Expense cost method','method',[{value:'received',label:'Use received repayments'},{value:'agreed',label:'Set agreed shares'}],draft.shares?'agreed':'received')}${draft.shares?`${avatars(draft.shares,true)}${balanceBar(draft.shares,draft.total,person,'people')}<button id="equal-people">Split equally</button>`:`<div class="summary-line"><span>Linked repayments</span><strong>${money(repayments)}</strong></div><div class="summary-line"><span>Your remaining cost</span><strong>${money(own)}</strong></div><p class="subline">The part not covered by received repayments is yours.</p>`}<div id="expense-preview" class="notice"></div><div class="error" role="alert" id="form-error"></div><div class="actions"><small>${draft.balanced?'Previously reviewed':'This expense needs its own review.'}</small><button class="primary" id="save-expense">Confirm expense</button></div></section>`;}
function balanceQueue(){const visible=state.showAll?[...state.payments,...state.expenses]:outstanding();return `<aside><div class="line"><h3>${state.showAll?'All items':'Needs attention'}</h3><span class="tag">${outstanding().length} remaining</span></div>${options('Balance list','showAll',[{value:'false',label:'Needs attention'},{value:'true',label:'All items'}],String(state.showAll))}${visible.map(r=>`<button class="item" data-review="${r.id}" aria-pressed="${state.active===r.id}"><span>${esc(r.name)}<small>${r.amount!==undefined?'Money in':'Money out'} · ${esc(tagLabel(r))}${r.balanced?' · Reviewed':''}</small></span><span class="money">${sign(r)}${money(Model.rowTotal(r))}</span></button>`).join('')}</aside>`;}
function overview(){const spend=state.expenses.reduce((s,e)=>s+Model.personal(e,state.payments),0),applied=state.payments.reduce((s,p)=>s+(p.balanced?Model.sum(p.allocations):0),0),extra=state.payments.filter(p=>p.balanced&&p.kind==='repayment').reduce((s,p)=>s+p.income,0);return `<section class="panel"><h3>Everything has been reviewed.</h3><div class="summary-line"><span>Your expense cost</span><strong>${money(spend)}</strong></div><div class="summary-line"><span>Repayments applied to expenses</span><strong>${money(applied)}</strong></div><div class="summary-line"><span>Unassigned e-transfer income</span><strong>${money(extra)}</strong></div><p class="subline">Unassigned transfer income is visible separately from job income. Internal transfers are not listed here.</p><button id="show-all">View all items</button></section>`;}
function balanceView(){const visible=state.showAll?[...state.payments,...state.expenses]:outstanding();if(visible.length&&!visible.some(r=>r.id===state.active)){state.active=visible[0].id;draft=null;}if(visible.length&&!draft)prepare();return heading('Deduct &amp; balance','Allocate incoming money, then confirm each expense on its own.')+`${state.toast?`<div class="success-line"><span>${esc(state.toast)}</span>${undoState?'<button id="undo">Undo last save</button>':''}</div>`:''}<div class="layout">${balanceQueue()}${visible.length?(draft.amount!==undefined?paymentEditor():expenseEditor()):overview()}</div>`;}

function purposeLines(f){const lines=[['Income',f.earned],['Repayments of expenses',f.repaid],['Mixed repayment + transfer income',f.mixed],['Unassigned e-transfer income',f.unassigned],['Not yet reviewed',f.unreviewed]].filter(([,n])=>n);return lines.map(([label,n])=>`<div class="summary-line sub"><span>${label}</span><span class="money">+${money(n)}</span></div>`).join('');}
function flowSummary(f){return `<div class="summary-line"><span>Money out</span><strong class="money">−${money(f.out)}</strong></div><div class="summary-line"><span>Money in</span><strong class="money">+${money(f.in)}</strong></div>${purposeLines(f)}${f.moved?`<div class="summary-line"><span>Moved between own accounts</span><strong class="money">⇄${money(f.moved)}</strong></div>`:''}`;}
function viewDetail(){const v=state.views.find(v=>v.id===state.view);if(!v)return '<div class="empty">Choose a view, or create one.</div>';const f=Model.flows(rows(),v.tags),drill=v.tags.includes(state.drill)?state.drill:'',list=Model.viewRows(rows(),drill?[drill]:v.tags);return `<section class="panel" aria-label="${esc(v.name)} view"><div class="review-title"><div><small>CATEGORY VIEW</small><h3>${esc(v.name)}</h3></div><form id="rename-view" class="create-form" style="margin:0"><label class="field">Rename<input id="view-rename" type="text" value="${esc(v.name)}" maxlength="40" required aria-label="Rename view"></label><button>Rename</button></form></div><div class="section-label">Tags in this view</div><div class="tag-choices" role="group" aria-label="Tags included in ${esc(v.name)}">${state.tags.map(t=>{const others=viewsWithTag(t.id).filter(o=>o.id!==v.id);return `<button data-view-tag="${t.id}" aria-pressed="${v.tags.includes(t.id)}">${esc(t.name)}<small>${others.length?'Also in '+esc(others.map(o=>o.name).join(', ')):(v.tags.includes(t.id)?'Only here':'Not in a view yet')}</small></button>`;}).join('')}</div><p class="subline">Changing these tags changes what you look at. Transactions, portions, repayments, and events stay exactly as they are.</p><span class="gross-label">Gross tagged flows · before repayments and shares</span>${v.tags.length?flowSummary(f):'<p class="muted">Add tags to see their flows.</p>'}<div class="section-label">By tag</div>${v.tags.map(id=>{const t=f.byTag[id]||{out:0,in:0,moved:0,count:0};return `<button class="contrib-row" data-drill="${id}" aria-pressed="${drill===id}"><span>${esc(tagName(id))}<small>${t.count} portion${t.count===1?'':'s'}${viewsWithTag(id).length>1?' · shared with '+esc(viewsWithTag(id).filter(o=>o.id!==v.id).map(o=>o.name).join(', ')):''}</small></span><span class="money">${laneTotals(t)||'—'}</span></button>`;}).join('')||'<p class="muted">No tags chosen.</p>'}<div class="section-label">${drill?'Transactions tagged '+esc(tagName(drill)):'Transactions in this view'}</div>${list.map(x=>`<div class="portion"><span><strong>${esc(x.name)}</strong><small>${x.date} · ${esc(x.account)} · ${esc(x.purpose.label)}</small><small>${Object.entries(x.portions).map(([t,n])=>esc(tagName(t))+' '+money(n)).join(' · ')}</small></span><span class="money">${({out:'−',in:'+',moved:'⇄'})[x.direction]}${money(x.inView)}${x.inView!==x.total?`<small>of ${money(x.total)}</small>`:''}</span><button class="row-action" data-edit-tags="${x.id}">Edit tags in Organize</button></div>`).join('')||'<p class="muted">Nothing tagged here yet.</p>'}<div class="actions">${state.confirmDelete?`<span class="warn">Delete the ${esc(v.name)} view? Its tags and transactions stay.</span><span><button id="keep-view">Keep</button> <button id="confirm-delete" class="danger">Delete view</button></span>`:`<small>Deleting a view never deletes tags or transactions.</small><button id="delete-view" class="danger">Delete view</button>`}</div></section>`;}
function insightsView(){const all=Model.flows(rows(),state.tags.map(t=>t.id)),untagged=Model.untagged(rows()),compared=state.views.filter(v=>state.compare.includes(v.id)),combined=compared.length?Model.combine(rows(),compared):null;return heading('Look at your month through category views','Views collect tags into insights. Edit them freely: they change how you look at the data, not what the data says.')+`<div class="insights-layout"><aside><h3>Category views</h3>${state.views.map(v=>{const f=Model.flows(rows(),v.tags);return `<div class="view-row"><button class="item" data-open-view="${v.id}" aria-pressed="${state.view===v.id}"><span>${esc(v.name)}<small>${esc(v.tags.map(tagName).join(', ')||'No tags yet')}</small></span><span class="money">${laneTotals(f)||'—'}</span></button><label class="check"><input type="checkbox" data-compare="${v.id}" ${state.compare.includes(v.id)?'checked':''} aria-label="Combine ${esc(v.name)}">Combine</label></div>`;}).join('')}<form id="create-view" class="create-form"><label class="field">New view<input id="view-name" type="text" aria-label="New view name" placeholder="e.g. Essentials" maxlength="40" required></label><button>Create view</button></form><div class="error" role="alert" id="board-error"></div>${combined?`<section class="panel" style="margin-top:16px" aria-label="Combined views"><h3>Combined: ${esc(compared.map(v=>v.name).join(' + '))}</h3><span class="gross-label">Gross tagged flows · each portion counted once</span>${flowSummary(combined)}<p class="subline">${combined.overlap.length?esc(combined.overlap.map(tagName).join(', '))+(combined.overlap.length>1?' appear':' appears')+' in more than one selected view and '+(combined.overlap.length>1?'are':'is')+' counted once.':'These views share no tags.'}</p></section>`:''}<section class="panel" style="margin-top:16px" aria-label="All tagged flows"><h3>All tags</h3><span class="gross-label">Gross tagged flows · before repayments and shares</span>${flowSummary(all)}<p class="subline">${untagged.length?untagged.length+' transaction'+(untagged.length>1?'s':'')+' without tags ('+esc(untagged.map(r=>r.name).join(', '))+') appear in no view.':'Every transaction is tagged.'} Net personal cost by tag is not calculated: repayments apply to whole expenses in Deduct &amp; balance.</p></section></aside>${viewDetail()}</div>`;}

function render(){root.querySelectorAll('[data-stage]').forEach(b=>{b.disabled=Number(b.dataset.stage)>state.unlocked;if(Number(b.dataset.stage)===state.stage)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.innerHTML=[importView,organizeView,groupView,balanceView,insightsView][state.stage]();if(state.stage===3)updatePreview();if(design.density==='Compact')main.querySelectorAll('.panel').forEach(p=>p.style.padding='12px');}
function barValues(kind){return kind==='tags'?tagDraft.tags:kind==='payment'?draft.values:draft.shares;}
function barTotal(kind){return kind==='tags'?Model.rowTotal(tagDraft):kind==='payment'?draft.amount:draft.total;}
function barCaps(kind){return kind==='payment'?{...capacities(),income:draft.amount}:{};}
function updateBar(kind){const values=barValues(kind),total=barTotal(kind),ids=Object.keys(values),box=main.querySelector(`[data-bar="${kind}"]`);if(!box)return;let at=0;ids.forEach((id,i)=>{box.querySelector(`[data-amount="${id}"]`).textContent=money(values[id]);box.querySelector(`[data-segment="${id}"]`).style.width=values[id]/total*100+'%';at+=values[id];if(i<ids.length-1){const r=box.querySelector(`[data-divider="${i}"]`),n=box.querySelector(`[data-boundary="${i}"]`);r.value=at;r.setAttribute('aria-valuetext',money(values[id])+' / '+money(values[ids[i+1]]));if(document.activeElement!==n)n.value=(at/100).toFixed(2);}});if(kind==='tags'){const even=main.querySelector('#even-tags');if(even)even.disabled=Model.isEqualSplit(values,total);}}
function updatePreview(){if(!draft)return;const payment=main.querySelector('#payment-preview');if(payment){const applied=Object.entries(draft.values).filter(([id])=>id!=='income').reduce((s,[,n])=>s+n,0);payment.textContent=money(applied)+' will offset expenses. '+money(draft.values.income)+' will be recorded as Unassigned e-transfer income.';}const expense=main.querySelector('#expense-preview');if(expense){const own=Model.personal(draft,state.payments);const owed=draft.shares?Math.max(0,draft.total-own-Model.paid(draft.id,state.payments)):0;expense.textContent=draft.shares?'Your agreed share: '+money(own)+' · Still owed by others: '+money(owed):'Your cost updates from received repayment links. Saving a repayment does not confirm this expense.';}}
function showError(message,id='form-error'){const box=main.querySelector('#'+id);if(box)box.textContent=message;say(message);}
function validateBoundaryInputs(){for(const n of main.querySelectorAll('[data-boundary]')){const value=Model.cents(n.value),values=barValues(n.dataset.kind),actual=Object.values(values).slice(0,Number(n.dataset.boundary)+1).reduce((a,b)=>a+b,0);if(!Number.isInteger(value)||value!==actual)throw Error('Use a divider position within its neighbouring limits and chosen precision.');}}
function complete(message){state.toast=message;draft=null;state.active=outstanding()[0]?.id||'';render();say(message);}
function savePayment(){try{if(draft.kind==='repayment'&&!draft.person)throw Error('Select the sender.');validateBoundaryInputs();const original=state.payments.find(p=>p.id===draft.id),candidate=draft.kind==='income'?{...draft,values:{income:draft.amount},targets:[]}:draft;const saved=Model.savePayment(original,candidate,state.expenses,state.payments);capture();state.payments[state.payments.findIndex(p=>p.id===saved.id)]=saved;if(draft.remember&&draft.person)state.aliases[draft.sender]=draft.person;complete('Payment allocation saved. Expense review and tags are unchanged.');}catch(e){showError(e.message);}}
function moveDivider(kind,index,value){const values=Model.divider(barValues(kind),index,value,state.precision,barCaps(kind));if(kind==='tags'){tagDraft.tags=values;tagDraft.notice='';const notice=main.querySelector('.notice.review');if(notice)notice.remove();}else if(kind==='payment')draft.values=values;else draft.shares=values;updateBar(kind);updatePreview();const error=main.querySelector('#form-error');if(error)error.textContent='';}
function openEditor(id){const r=findRow(id);if(!r)return;if(state.stage!==1){state.stage=1;state.selected=[];state.selectedSource={};draft=null;}tagDraft={...clone(r),notice:''};render();main.querySelector('.tag-editor')?.scrollIntoView({block:'nearest'});}
function assign(destination,ids,source=''){if(!ids.length){say('Select one or more items first.');return;}if(state.stage===1){for(const r of ids.map(findRow).filter(Boolean))replaceRow(destination==='__unassigned'?{...r,tags:{}}:Model.moveTag(r,state.selectedSource[r.id]||source||'',destination));}else if(destination==='__unassigned')state.groups=state.groups.map(g=>({...g,members:g.members.filter(id=>!ids.includes(id))}));else state.groups=Model.groupRows(state.groups,ids,destination);state.selected=[];state.selectedSource={};tagDraft=null;render();say(state.stage===1?'Tags updated. Tagged items leave Needs tags.':'Event updated.');}
function boardClick(b){
 if(b.dataset.editTags){openEditor(b.dataset.editTags);return true;}
 if(b.dataset.toggleTag){const id=b.dataset.toggleTag,current=Object.keys(tagDraft.tags),next=state.tags.map(t=>t.id).filter(t=>current.includes(t)!==(t===id));const result=Model.retag(tagDraft.tags,Model.rowTotal(tagDraft),next);tagDraft.tags=result.tags;tagDraft.notice=result.kept?(result.added.length?'Your adjusted portions were kept. '+result.added.map(tagName).join(', ')+' starts at $0.00: drag a divider or choose Split evenly.':'Your adjusted portions were kept. The amount from '+result.removed.map(tagName).join(', ')+' moved to the remaining tags; review or choose Split evenly.'):'';render();return true;}
 if(b.id==='even-tags'){tagDraft.tags=Model.equal(Model.rowTotal(tagDraft),Object.keys(tagDraft.tags));tagDraft.notice='';render();return true;}
 if(b.id==='cancel-tags'){tagDraft=null;render();return true;}
 if(b.id==='clear-tags'){assign('__unassigned',[tagDraft.id]);return true;}
 if(b.id==='save-tags'){try{if(!Object.keys(tagDraft.tags).length)throw Error('Choose at least one tag, or return to needs tags.');validateBoundaryInputs();const {notice,...row}=tagDraft;replaceRow(Model.setTags(row,row.tags));tagDraft=null;state.selected=[];render();say('Tags saved. Purpose, repayments, and events are unchanged.');}catch(e){showError(e.message);}return true;}
 if(b.id==='manage-tags'){state.manageTags=!state.manageTags;render();return true;}
 if(b.dataset.renameSubmit){main.querySelector(`[data-rename-tag="${b.dataset.renameSubmit}"]`).requestSubmit();return true;}
 if(b.dataset.removeTag){try{const out=Model.removeTag(state.tags,state.views,rows(),b.dataset.removeTag);state.tags=out.tags;state.views=out.views;render();say('Tag removed from the tag list and from any views.');}catch(e){showError(e.message,'board-error');}return true;}
 if(b.dataset.removeMember){state.groups=state.groups.map(g=>g.id===b.dataset.group?{...g,members:g.members.filter(id=>id!==b.dataset.removeMember)}:g);render();return true;}
 if(b.dataset.openView){state.view=b.dataset.openView;state.drill='';state.confirmDelete=false;render();return true;}
 if(b.dataset.viewTag){state.views=Model.toggleViewTag(state.views,state.view,b.dataset.viewTag);render();say('View updated. Transactions are unchanged.');return true;}
 if(b.dataset.drill){state.drill=state.drill===b.dataset.drill?'':b.dataset.drill;render();return true;}
 if(b.id==='delete-view'){state.confirmDelete=true;render();return true;}
 if(b.id==='keep-view'){state.confirmDelete=false;render();return true;}
 if(b.id==='confirm-delete'){state.views=Model.removeView(state.views,state.view);state.compare=state.compare.filter(id=>id!==state.view);state.view=state.views[0]?.id||'';state.confirmDelete=false;render();say('View deleted. Tags and transactions remain.');return true;}
 return false;}
root.addEventListener('input',event=>{const el=event.target;if(el.id==='target-search'){state.query=el.value;main.querySelector('#target-list').innerHTML=targetList();return;}if(el.id==='find'){state.find=el.value;const at=el.selectionStart;render();const again=main.querySelector('#find');again.focus();again.setSelectionRange(at,at);return;}if(el.dataset.divider!==undefined||el.dataset.boundary!==undefined){const value=el.dataset.divider!==undefined?Number(el.value):Model.cents(el.value);if(!Number.isInteger(value)||value<0)return;moveDivider(el.dataset.kind,Number(el.dataset.divider??el.dataset.boundary),value);}});
root.addEventListener('keydown',event=>{const el=event.target;if(el.dataset.divider===undefined)return;const values=barValues(el.dataset.kind),i=Number(el.dataset.divider),current=Object.values(values).slice(0,i+1).reduce((a,b)=>a+b,0),total=Object.values(values).reduce((a,b)=>a+b,0);const next={ArrowRight:current+state.precision,ArrowUp:current+state.precision,ArrowLeft:current-state.precision,ArrowDown:current-state.precision,Home:0,End:total}[event.key];if(next===undefined)return;event.preventDefault();moveDivider(el.dataset.kind,i,next);});
root.addEventListener('change',event=>{const el=event.target;if(el.id==='remember')draft.remember=el.checked;if(el.dataset.compare){state.compare=el.checked?[...new Set([...state.compare,el.dataset.compare])]:state.compare.filter(id=>id!==el.dataset.compare);render();}});
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(boardClick(b))return;if(b.dataset.stage!==undefined)return go(Number(b.dataset.stage));if(b.dataset.grab){if(performance.now()<suppressClickUntil)return;state.selectedSource[b.dataset.grab]=b.dataset.source||'';state.selected=state.selected.includes(b.dataset.grab)?state.selected.filter(id=>id!==b.dataset.grab):[...state.selected,b.dataset.grab];render();return;}if(b.dataset.drop!==undefined)return assign(b.dataset.drop,state.selected);if(b.dataset.review){state.active=b.dataset.review;draft=null;render();return;}if(b.dataset.precision){state.precision=Number(b.dataset.precision);render();return;}if(b.dataset.target){draft.targets=Model.toggleTargets(draft.targets,b.dataset.target,state.groups,state.expenses);allocateEvenly();render();return;}if(b.dataset.person){if(b.dataset.multiple==='true'){const ids=Object.keys(draft.shares).filter(id=>id!==b.dataset.person);if(!Object.hasOwn(draft.shares,b.dataset.person))ids.push(b.dataset.person);draft.shares=Model.equal(draft.total,ids);}else{draft.person=b.dataset.person;allocateEvenly();}render();return;}if(b.dataset.option){const f=b.dataset.option,v=b.dataset.value;if(f==='showAll'){state.showAll=v==='true';draft=null;}else if(f==='kind')draft.kind=v;else if(f==='method')draft.shares=v==='received'?null:Model.equal(draft.total,['me','alex']);render();return;}switch(b.id){case'import':state.unlocked=4;go(1);break;case'next-stage':go(state.stage+1);break;case'distribute':allocateEvenly();render();break;case'equal-people':draft.shares=Model.equal(draft.total,Object.keys(draft.shares));render();break;case'save-payment':savePayment();break;case'save-expense':try{validateBoundaryInputs();Model.validateShares(draft,state.payments);capture();draft.balanced=true;state.expenses[state.expenses.findIndex(e=>e.id===draft.id)]=clone(draft);complete('Expense confirmed.');}catch(e){showError(e.message);}break;case'undo':if(undoState){state.expenses=undoState.expenses;state.payments=undoState.payments;state.aliases=undoState.aliases;state.active=undoState.active;undoState=null;draft=null;state.toast='Last save undone.';render();}break;case'show-all':state.showAll=true;draft=null;render();break;}});
root.addEventListener('submit',event=>{event.preventDefault();const form=event.target;try{if(form.id==='create-group'){const name=main.querySelector('#group-name').value.trim();if(!name)return;state.groups.push({id:Model.slug('event',name,state.groups.map(g=>g.id)),name,members:[]});render();say('Event created.');}else if(form.id==='create-tag'){state.tags=Model.addTag(state.tags,main.querySelector('#tag-name').value);render();say('Tag created. It is ready to use and can be added to any view.');}else if(form.dataset.renameTag){state.tags=Model.renameTag(state.tags,form.dataset.renameTag,form.elements.name.value);render();say('Tag renamed everywhere it appears.');}else if(form.id==='create-view'){state.views=Model.addView(state.views,main.querySelector('#view-name').value);state.view=state.views[state.views.length-1].id;state.drill='';render();say('View created. Choose the tags it should include.');}else if(form.id==='rename-view'){state.views=Model.renameView(state.views,state.view,main.querySelector('#view-rename').value);render();say('View renamed. Transactions are unchanged.');}}catch(e){showError(e.message,'board-error');}});
root.addEventListener('pointerdown',event=>{const item=event.target.closest('[data-grab]');if(!item||event.button!==0)return;dragState={id:item.dataset.grab,source:item.dataset.source||'',x:event.clientX,y:event.clientY,pointer:event.pointerId,item,moved:false};item.setPointerCapture(event.pointerId);});
root.addEventListener('pointermove',event=>{if(!dragState||event.pointerId!==dragState.pointer)return;if(Math.hypot(event.clientX-dragState.x,event.clientY-dragState.y)>6)dragState.moved=true;if(!dragState.moved)return;event.preventDefault();root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]')?.classList.add('drag-over');});
root.addEventListener('pointerup',event=>{if(!dragState||event.pointerId!==dragState.pointer)return;const current=dragState;dragState=null;if(current.item.hasPointerCapture(event.pointerId))current.item.releasePointerCapture(event.pointerId);root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(!current.moved)return;suppressClickUntil=performance.now()+150;const bucket=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop]');if(bucket)assign(bucket.dataset.drop,state.selected.includes(current.id)?state.selected:[current.id],current.source);});
root.addEventListener('pointercancel',()=>{dragState=null;root.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'Workspace spacing',options:['Comfortable','Compact']});}
})();
</script>
</div>
